name: Validate Factoori local sync engine

on:
  push:
    branches:
      - work/factoori-shared-db-integration
    paths:
      - "sync-engine.js"
      - "sync-engine.test.js"
      - "sync-storage.js"
      - "sync-db-adapter.js"
      - "sync-runtime.js"
      - "cloud-client.js"
      - "cloud-health.js"
      - "supabase/drafts/**.sql"
      - "index.html"
      - ".github/workflows/factoori-sync-engine-tests.yml"
  pull_request:
    paths:
      - "sync-engine.js"
      - "sync-engine.test.js"
      - "sync-storage.js"
      - "sync-db-adapter.js"
      - "sync-runtime.js"
      - "cloud-client.js"
      - "index.html"
      - ".github/workflows/factoori-sync-engine-tests.yml"
      - "cloud-health.js"
      - "supabase/drafts/**.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sync engine regression tests
        run: node --test sync-engine.test.js

name: Factoori Dependency Lock and Audit

on:
  push:
    branches:
      - work/factoori-redesign-myket-iap
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/factoori-dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: factoori-dependency-lock
  cancel-in-progress: false

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify reproducible dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
      - name: Commit refreshed dependency lock and queue verified APK build
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency lock is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock verified Capacitor 8 dependencies for Factoori 1.2.43"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue APK build with committed lock
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run factori-build3.yml --ref "$GITHUB_REF_NAME"
      - name: Audit locked dependency tree
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
      - uses: actions/upload-artifact@v4
        with:
          name: factoori-dependency-audit
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error

name: Validate Factoori database drafts

on:
  push:
    branches:
      - work/factoori-shared-db-integration
    paths:
      - "supabase/drafts/**"
      - "supabase/tests/**"
      - "supabase/functions/prove-sync-device/**"
      - ".github/workflows/factoori-database-tests.yml"
  pull_request:
    paths:
      - "supabase/drafts/**"
      - "supabase/tests/**"
      - "supabase/functions/prove-sync-device/**"
      - ".github/workflows/factoori-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: factoori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoori_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: factoori_test

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap minimal Supabase Auth compatibility
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create table auth.users (
            id uuid primary key,
            email text,
            email_confirmed_at timestamptz,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid()
          returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant select on auth.users to authenticated, service_role;
          SQL

      - name: Apply draft migrations in dependency order
        run: |
          set -euo pipefail
          for migration in \
            001_identity_business_permissions.sql \
            002_core_documents.sql \
            003_financial_ledger.sql \
            004_catalog_inventory.sql \
            004a_sync_infrastructure.sql \
            005_sync_compatibility.sql \
            006_journal_integrity.sql \
            007_member_management.sql \
            008_transactional_posting.sql \
            009_device_proof.sql \
            010_account_transfers.sql \
            011_employee_provisioning.sql \
            012_member_reactivation.sql \
            014_legacy_normalized_mapping.sql \
            015_legacy_normalization_preflight.sql \
            016_accounting_defaults.sql \
            017_customer_receipt_posting.sql \
            018_simple_financial_posting.sql \
            019_purchase_document_posting.sql \
            020_goods_sale_posting.sql \
            021_fifo_warehouse_transfers.sql \
            022_inventory_opening_posting.sql \
            023_inventory_wastage_posting.sql
          do
            echo "::group::Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "supabase/drafts/$migration"
            echo "::endgroup::"
          done

      - name: Bootstrap existing license schema fixture and apply account entitlement draft
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create table public.factori_license_keys (
            id uuid primary key default gen_random_uuid(),
            key_hash text not null unique,
            status text not null check (status in ('unused','active','revoked')),
            created_at timestamptz not null default now(),
            activated_at timestamptz,
            revoked_at timestamptz,
            order_id text unique,
            encrypted_key text,
            payment_reference text,
            payment_gateway text,
            amount_paid_toman bigint,
            payment_verified_at timestamptz
          );
          create table public.factori_license_activations (
            id uuid primary key default gen_random_uuid(),
            license_id uuid not null references public.factori_license_keys(id),
            device_jwk jsonb not null,
            device_thumbprint text not null,
            activated_at timestamptz not null default now(),
            transferred_from uuid
          );
          alter table public.factori_license_keys enable row level security;
          alter table public.factori_license_activations enable row level security;
          SQL
          echo "::group::Applying 013_account_bound_license_entitlements.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/013_account_bound_license_entitlements.sql
          echo "::endgroup::"
      - name: Run database regression checks
        run: |
          set -euo pipefail
          for test_file in \
            001_identity_business_permissions.sql \
            002_core_documents.sql \
            003_financial_ledger.sql \
            004_catalog_inventory.sql \
            004a_sync_infrastructure.sql \
            005_sync_compatibility.sql \
            006_journal_integrity.sql \
            007_member_management.sql \
            008_security_surface.sql \
            009_sensitive_payload_partition.sql \
            010_transactional_posting.sql \
            011_device_proof.sql \
            011_employee_provisioning.sql \
            012_account_transfers.sql \
            012_member_reactivation.sql \
            013_account_bound_license_entitlements.sql \
            014_legacy_normalized_mapping.sql \
            015_legacy_normalization_preflight.sql \
            016_accounting_defaults.sql \
            017_customer_receipt_posting.sql \
            018_simple_financial_posting.sql \
            019_purchase_document_posting.sql \
            020_goods_sale_posting.sql \
            021_fifo_warehouse_transfers.sql
          do
            echo "::group::Testing $test_file"
            psql -v ON_ERROR_STOP=1 -f "supabase/tests/$test_file"
            echo "::endgroup::"
          done

      - name: Verify migration objects and isolation
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "select count(*) as public_tables from information_schema.tables where table_schema='public' and table_type='BASE TABLE';"
          psql -v ON_ERROR_STOP=1 -c "select count(*) as security_definer_functions from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private') and p.prosecdef;"

  device-proof-crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test P-256 device proof and replay rejection
        run: deno test supabase/functions/prove-sync-device/crypto_test.ts
      - name: Type-check proof Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/prove-sync-device/index.ts

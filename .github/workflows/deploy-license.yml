
name: Deploy Factori license function

on:
  push:
    branches:
      - license-integration
    paths:
      - "supabase/functions/activate-license/**"
      - ".github/workflows/deploy-license.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx --yes supabase@latest functions deploy activate-license --project-ref "$SUPABASE_PROJECT_REF"
        

name: Build Android APK
# Release build: Factori 1.2.5

on:
  push:
    branches: [main, license-integration, feature/finance-dashboard-sms, feature/creditors-dashboard-redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange project files
        run: |
          mkdir -p www/lib assets
          mv -f index.html www/index.html
          mv -f icon-only.png icon-foreground.png icon-background.png splash.png assets/

      - name: Validate application JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline application script was not found');
          new Function(match[1]);
          console.log('Inline application JavaScript syntax is valid.');
          NODE

      - name: Install dependencies
        run: npm install

      - name: Bundle license client
        run: |
          npx esbuild license-client.js --bundle --format=esm --outfile=www/license-client.js

      - name: Copy offline libraries
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle
          sed -i 's/minSdkVersion 22/minSdkVersion 23/g' android/variables.gradle
          grep -n 'minSdk' android/variables.gradle

      - name: Set Android update version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 7/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.2.5"/' android/app/build.gradle
          grep -n -E 'versionCode|versionName' android/app/build.gradle

      - name: Allow fingerprint permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Verify native license plugin registration
        run: |
          echo "Checking Capacitor native plugin registry..."
          find android/app/src/main -type f -name 'capacitor.plugins.json' -print
          if ! grep -R -q 'LicenseManagerPlugin' android/app/src/main/assets; then
            echo "::error::LicenseManagerPlugin is missing from the generated Android plugin registry."
            echo "Plugin package files:"
            find plugins/capacitor-license-manager -type f -maxdepth 8 -print
            exit 1
          fi
          echo "LicenseManagerPlugin is registered."

      - name: Use and verify fixed signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          install -m 600 "$GITHUB_WORKSPACE/debug.keystore" "$HOME/.android/debug.keystore"
          echo "Signing keystore fingerprint:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'Alias name:|SHA256:'

      - name: Force Gradle debug signing key
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Force the same checked-in key for every debug APK.
          android {
            signingConfigs {
              debug {
                storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.debug
              }
            }
          }
          EOF
          echo "Gradle debug signing configuration:"
          grep -n -A8 -B2 'Force the same checked-in key' android/app/build.gradle

      - name: Build and verify APK signature
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          KEY_FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}')
          APK_FP=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | awk '/SHA256:/{print $2; exit}')
          echo "Expected keystore SHA256: $KEY_FP"
          echo "Actual APK SHA256:        $APK_FP"
          test -n "$KEY_FP"
          test "$KEY_FP" = "$APK_FP" || { echo "::error::APK was not signed with the fixed keystore."; exit 1; }
          echo "APK signature matches the fixed keystore."
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Factori-v1.2.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: factori-android-v1.2.5
          path: android/app/build/outputs/apk/debug/Factori-v1.2.5.apk

name: Build Android APK
# First official Myket release: Factori 1.2.22
# Rebuild with nested advanced-settings picker fix

on:
  push:
    branches: [main, license-integration, feature/finance-dashboard-sms, feature/creditors-dashboard-redesign, feature/factori-v1.2.11-safe-updates, feature/factori-v1.2.12-date-picker-cleanup, feature/factori-v1.2.13-date-services, feature/factori-advanced-settings, feature/factori-v1.2.15-sms-guide-customers-advanced-dialogs, fix/factori-1.2.16-advanced-settings-selectors, feature/factori-v1.2.17-home-promo-copy, release/myket-first-release]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange project files
        run: |
          mkdir -p www/lib assets
          mv -f index.html www/index.html
          mv -f icon-only.png icon-foreground.png icon-background.png splash.png assets/

      - name: Verify requested homepage promo is in the active app entry
        run: |
          set -euo pipefail
          grep -Fq 'طراحی سایت و ساخت اپلیکیشن اندروید' www/index.html
          grep -Fq 'مشاهده خدمات و ثبت سفارش در factoori.ir' www/index.html
          grep -Fq 'https://factoori.ir/custom-web-app/' www/index.html
          if grep -Fq 'یک برنامه تازه در راه است!' www/index.html; then
            echo "::error::Old homepage promo is still present."
            exit 1
          fi
          echo "The active homepage contains the requested service promo."

      - name: Validate application JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline application script was not found');
          new Function(match[1]);
          console.log('Inline application JavaScript syntax is valid.');
          NODE

      - name: Install dependencies
        run: npm install

      - name: Bundle license client
        run: |
          npx esbuild license-client.js --bundle --format=esm --outfile=www/license-client.js
          npx esbuild back-handler.js --bundle --format=iife --outfile=www/back-handler.js

      - name: Copy offline libraries
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle
          sed -i 's/minSdkVersion 22/minSdkVersion 23/g' android/variables.gradle
          grep -n 'minSdk' android/variables.gradle

      - name: Set Android update version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 24/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.2.22"/' android/app/build.gradle
          grep -n -E 'versionCode|versionName' android/app/build.gradle
          grep -q 'versionCode 24' android/app/build.gradle
          grep -q 'versionName "1.2.22"' android/app/build.gradle
          echo "Android update version verified: 1.2.22 (23)"

      - name: Allow fingerprint permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\\n    <uses-permission android:name="android.permission.CAMERA" />\\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Verify native license plugin registration
        run: |
          echo "Checking Capacitor native plugin registry..."
          find android/app/src/main -type f -name 'capacitor.plugins.json' -print
          if ! grep -R -q 'LicenseManagerPlugin' android/app/src/main/assets; then
            echo "::error::LicenseManagerPlugin is missing from the generated Android plugin registry."
            echo "Plugin package files:"
            find plugins/capacitor-license-manager -type f -maxdepth 8 -print
            exit 1
          fi
          echo "LicenseManagerPlugin is registered."

      - name: Configure dedicated release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.FACTOORI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.FACTOORI_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FACTOORI_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FACTOORI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing FACTOORI_RELEASE_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "::error::Missing FACTOORI_RELEASE_STORE_PASSWORD repository secret."; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "::error::Missing FACTOORI_RELEASE_KEY_ALIAS repository secret."; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::Missing FACTOORI_RELEASE_KEY_PASSWORD repository secret."; exit 1; }
          mkdir -p "$RUNNER_TEMP/factori-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/factori-signing/factori-release.jks"
          chmod 600 "$RUNNER_TEMP/factori-signing/factori-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/factori-signing/factori-release.jks" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "Dedicated release keystore is present and alias is valid."
          echo "FACTOORI_RELEASE_STORE_FILE=$RUNNER_TEMP/factori-signing/factori-release.jks" >> "$GITHUB_ENV"

      - name: Configure Gradle release signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.FACTOORI_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FACTOORI_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FACTOORI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle <<'EOF'

          // Dedicated, stable signing identity for all official Factori releases.
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("FACTOORI_RELEASE_STORE_FILE"))
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          EOF
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle

      - name: Build and verify official Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.FACTOORI_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.FACTOORI_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.FACTOORI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          keytool -list -v -keystore "$FACTOORI_RELEASE_STORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/keystore-info.txt"
          keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          KEY_FP=$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/keystore-info.txt")
          APK_FP=$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/apk-cert.txt")
          echo "Expected release certificate SHA256: $KEY_FP"
          echo "Actual APK certificate SHA256:       $APK_FP"
          test -n "$KEY_FP"
          test "$KEY_FP" = "$APK_FP" || { echo "::error::Release APK certificate does not match the dedicated release keystore."; exit 1; }
          cp "$APK" "app/build/outputs/apk/release/Factori-v1.2.22-release.apk"
          sha256sum "app/build/outputs/apk/release/Factori-v1.2.22-release.apk"
          echo "Official release APK signature verified."

      - uses: actions/upload-artifact@v4
        with:
          name: factori-android-v1.2.22-release
          path: android/app/build/outputs/apk/release/Factori-v1.2.22-release.apk
          if-no-files-found: error

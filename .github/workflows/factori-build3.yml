name: Build Android APK

on:
  push:
    branches: [main, factoori-currency-unit-settings]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          mkdir -p www/lib assets
          mv -f index.html www/index.html
          mv -f icon-only.png icon-foreground.png icon-background.png splash.png assets/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy offline libraries (PDF and image export)
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

      - name: Add Android platform
        run: npx cap add android

      - name: Allow fingerprint permission
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n BIOMETRIC android/app/src/main/AndroidManifest.xml

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Use fixed signing key (same key for install-over-update)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set app version 59 and release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 59')
          s = s.replace('versionName "1.0"', 'versionName "1.2.59"')
          s = s.replace('release {', 'release {\n            signingConfig signingConfigs.debug')
          p.write_text(s)
          print('\n'.join(x for x in s.splitlines() if 'versionCode' in x or 'versionName' in x or 'signingConfig' in x))
          PY

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: factoori-v59-release
          path: android/app/build/outputs/apk/release/app-release.apk

name: Package Factoori Web Accounting
on:
  push:
    branches:
      - work/factoori-web-fixes-0.2.3
      - release/factoori-v1.2.61-from-v58
    paths:
      - 'wordpress-plugin/factoori-web-accounting/**'
      - '.github/workflows/factoori-web-accounting-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin PHP
        run: php -l wordpress-plugin/factoori-web-accounting/factoori-web-accounting.php
      - name: Validate web application JavaScript
        run: node --check wordpress-plugin/factoori-web-accounting/assets/app.js
      - name: Build installable ZIP
        run: |
          mkdir -p dist
          cd wordpress-plugin
          zip -r ../dist/factoori-web-accounting-0.2.7.zip factoori-web-accounting
      - name: Verify ZIP
        run: unzip -t dist/factoori-web-accounting-0.2.7.zip
      - uses: actions/upload-artifact@v4
        with:
          name: factoori-web-accounting-0.2.7
          path: dist/factoori-web-accounting-0.2.7.zip
          if-no-files-found: error
          retention-days: 30

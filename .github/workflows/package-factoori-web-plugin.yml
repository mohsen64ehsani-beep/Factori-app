name: Package Factoori Web Accounting
on:
  push:
    branches:
      - factoori-web-plugin-0.2.0
    paths:
      - 'factoori-web-plugin-0.2.0/**'
      - '.github/workflows/package-factoori-web-plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress install ZIP
        run: |
          mkdir -p dist/factoori-web-accounting
          cp factoori-web-plugin-0.2.0/factoori-web-accounting.php dist/factoori-web-accounting/
          cp factoori-web-plugin-0.2.0/readme.txt dist/factoori-web-accounting/
          cp -R factoori-web-plugin-0.2.0/assets dist/factoori-web-accounting/
          cp -R factoori-web-plugin-0.2.0/templates dist/factoori-web-accounting/
          cd dist
          zip -r factoori-web-accounting-0.2.0.zip factoori-web-accounting
          unzip -t factoori-web-accounting-0.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: factoori-web-accounting-0.2.0-install
          path: dist/factoori-web-accounting-0.2.0.zip
          if-no-files-found: error

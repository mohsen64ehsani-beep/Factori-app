name: Deploy Faraz SMS gateway

on:
  push:
    branches: [feature/finance-dashboard-sms]
    paths:
      - "supabase/functions/send-faraz-sms/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-faraz-sms.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Faraz SMS Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx --yes supabase@latest functions deploy send-faraz-sms --project-ref "$SUPABASE_PROJECT_REF"

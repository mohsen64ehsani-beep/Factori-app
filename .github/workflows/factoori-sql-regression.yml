name: Factoori SQL regression

on:
  pull_request:
    paths:
      - "supabase/drafts/**"
      - "supabase/tests/**"
      - ".github/workflows/factoori-sql-regression.yml"
  push:
    branches:
      - "work/factoori-shared-db-integration"
    paths:
      - "supabase/drafts/**"
      - "supabase/tests/**"
      - ".github/workflows/factoori-sql-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-regression:
    name: PostgreSQL 17 isolated migration and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: factoori_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoori_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: factoori_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap minimal Supabase Auth compatibility
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text unique,
            email_confirmed_at timestamptz,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create function auth.uid()
          returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant select on auth.users to authenticated, service_role;
          SQL

      - name: Apply draft migrations in dependency order
        run: |
          set -euo pipefail
          for migration in \
            001_identity_business_permissions.sql \
            002_core_documents.sql \
            003_financial_ledger.sql \
            004_catalog_inventory.sql \
            004a_sync_infrastructure.sql \
            005_sync_compatibility.sql \
            006_journal_integrity.sql \
            007_member_management.sql
          do
            echo "::group::Apply ${migration}"
            psql -v ON_ERROR_STOP=1 -f "supabase/drafts/${migration}"
            echo "::endgroup::"
          done

      - name: Run SQL regression checks
        run: |
          set -euo pipefail
          for test_file in \
            001_identity_business_permissions.sql \
            002_core_documents.sql \
            003_financial_ledger.sql \
            004_catalog_inventory.sql \
            004a_sync_infrastructure.sql \
            005_sync_compatibility.sql \
            006_journal_integrity.sql \
            007_member_management.sql
          do
            echo "::group::Test ${test_file}"
            psql -v ON_ERROR_STOP=1 -f "supabase/tests/${test_file}"
            echo "::endgroup::"
          done

name: Update Supabase client lockfile

on:
  push:
    branches:
      - work/factoori-shared-db-integration
    paths:
      - "package.json"
      - "package-lock.json"
      - "cloud-client.js"
      - "index.html"
      - ".github/workflows/update-supabase-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/factoori-shared-db-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and verify dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          npx esbuild cloud-client.js --bundle --format=iife --outfile=/tmp/factoori-cloud-client.js
          node --check /tmp/factoori-cloud-client.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('Inline app script was not found');
          for (const match of scripts) new Function(match[1]);
          console.log('Inline app script syntax is valid.');
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update lockfile for Supabase shared account"
          git push origin HEAD:work/factoori-shared-db-integration

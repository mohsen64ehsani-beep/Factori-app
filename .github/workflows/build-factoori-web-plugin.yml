name: Build Factoori Web Accounting Plugin
on:
  push:
    branches:
      - work/factoori-shared-db-integration
    paths:
      - "wordpress-plugin/factoori-web-accounting/**"
      - ".github/workflows/build-factoori-web-plugin.yml"
  pull_request:
    paths:
      - "wordpress-plugin/factoori-web-accounting/**"
      - ".github/workflows/build-factoori-web-plugin.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate plugin structure
        run: |
          set -euo pipefail
          test -f wordpress-plugin/factoori-web-accounting/factoori-web-accounting.php
          test -f wordpress-plugin/factoori-web-accounting/assets/app.js
          test -f wordpress-plugin/factoori-web-accounting/assets/app.css
          test -f wordpress-plugin/factoori-web-accounting/templates/fullscreen.php
          php -l wordpress-plugin/factoori-web-accounting/factoori-web-accounting.php
          php -l wordpress-plugin/factoori-web-accounting/templates/fullscreen.php
          node --check wordpress-plugin/factoori-web-accounting/assets/app.js
      - name: Build and verify WordPress-installable artifact layout
        run: |
          set -euo pipefail
          mkdir -p dist/factoori-web-accounting
          cp -R wordpress-plugin/factoori-web-accounting/. dist/factoori-web-accounting/
          test -f dist/factoori-web-accounting/factoori-web-accounting.php
          php_version=$(grep -m1 -F 'Version:' dist/factoori-web-accounting/factoori-web-accounting.php | awk '{print $3}')
          readme_version=$(awk '/^Stable tag:/ {print $3; exit}' dist/factoori-web-accounting/readme.txt)
          test "$php_version" = "$readme_version"
          if find dist/factoori-web-accounting -type f | grep -Eq '(^|/)(\.git|\.DS_Store)(/|$)'; then
            echo "Unexpected development files found in plugin package" >&2
            exit 1
          fi
      - name: Upload WordPress-installable plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: factoori-web-accounting-0.1.2
          path: dist/factoori-web-accounting/
          if-no-files-found: error
          retention-days: 30

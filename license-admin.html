<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت لایسنس فاکتوری</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101323;color:white;font-family:Tahoma;padding:20px}
.container{max-width:650px;margin:30px auto;background:#1b2035;padding:22px;border-radius:18px}
h2{text-align:center;color:#9daaff}
input,button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;font-size:15px}
input{background:#292f49;color:white}
button{background:#6577ff;color:white;font-weight:bold}
.secondary{background:#343c58}
.hidden{display:none}
.card{background:#292f49;padding:14px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}
.code{font-size:19px;direction:ltr;text-align:center;color:#a9ffce;padding:12px}
.small{font-size:12px;color:#b8bfd5}
.status{color:#a9ffce}
.row{display:flex;gap:8px;align-items:center}
.row button{width:auto;flex:1}
.danger{background:#a83d52;width:auto}
</style>
</head>
<body>
<div class="container">
<h2>مدیریت لایسنس فاکتوری</h2>
<div id="login">
<p>ورود مدیر</p>
<input id="password" type="password" placeholder="رمز مدیریت">
<button onclick="login()">ورود</button>
</div>
<div id="panel" class="hidden">
<div class="card">
<button onclick="createLicense()">تولید کد لایسنس جدید</button>
<div id="newCode"></div>
</div>
<div class="row">
<h3>فهرست لایسنس‌ها</h3>
<button class="secondary" onclick="loadLicenses()">بروزرسانی</button>
</div>
<div id="licenses"></div>
<button class="secondary" onclick="logout()">خروج از مدیریت</button>
</div>
<div id="message" class="small"></div>
</div>
<script>
const API = "https://rtlwztotaolbnjdtsjqy.supabase.co/functions/v1/admin-license-manager";
let adminPassword = "";

function message(text){
  document.getElementById("message").textContent = text;
}

async function request(action, extra = {}){
  const res = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      action,
      password:adminPassword,
      ...extra
    })
  });
  const data = await res.json();
  if(!res.ok || !data.ok)
    throw new Error(data.error || "خطا در ارتباط با سرور");
  return data;
}

async function login(){
  const pass = document.getElementById("password").value.trim();
  if(!pass){
    message("رمز را وارد کن");
    return;
  }
  adminPassword = pass;
  try{
    await request("list");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    message("ورود موفق بود");
    loadLicenses();
  }catch(e){
    adminPassword = "";
    message(e.message);
  }
}

function logout(){
  adminPassword = "";
  document.getElementById("password").value = "";
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("newCode").innerHTML = "";
  message("از مدیریت خارج شدی");
}

async function createLicense(){
  try{
    const data = await request("create");
    document.getElementById("newCode").innerHTML =
      '<div class="card"><div class="small">کد جدید:</div>' +
      '<div class="code" id="generatedCode"></div>' +
      '<button class="secondary" onclick="copyCode()">کپی کد</button></div>';
    document.getElementById("generatedCode").textContent = data.code;
    message("کد ساخته شد");
    loadLicenses();
  }catch(e){
    message(e.message);
  }
}

async function copyCode(){
  const code = document.getElementById("generatedCode").textContent;
  try{
    await navigator.clipboard.writeText(code);
    message("کد کپی شد");
  }catch(e){
    message("کپی نشد؛ کد را دستی انتخاب کن");
  }
}
 async function loadLicenses(){
  const box = document.getElementById("licenses");
  box.textContent = "در حال دریافت...";
  try{
    const data = await request("list");
    if(!data.licenses.length){
      box.textContent = "هنوز لایسنسی ساخته نشده است";
      return;
    }

    box.innerHTML = "";
    data.licenses.forEach(item=>{
      const card = document.createElement("div");
      card.className = "card";

      const id = document.createElement("div");
      id.className = "small";
      id.textContent = "شناسه: " + item.id;

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = "وضعیت: " + statusText(item.status);

      const date = document.createElement("div");
      date.className = "small";
      date.textContent = "تاریخ ایجاد: " +
        new Date(item.created_at).toLocaleString("fa-IR");

      card.append(id,status,date);

      if(item.status === "unused"){
        const btn = document.createElement("button");
        btn.className = "danger";
        btn.textContent = "لغو کد";
        btn.onclick = ()=>revokeLicense(item.id);
        card.append(btn);
      }

      box.append(card);
    });
  }catch(e){
    box.textContent = e.message;
  }
}

function statusText(status){
  const names = {
    unused:"استفاده‌نشده",
    active:"فعال",
    revoked:"لغوشده"
  };
  return names[status] || status;
}

async function revokeLicense(id){
  if(!confirm("این کد استفاده‌نشده لغو شود؟")) return;
  try{
    await request("revoke",{id});
    message("کد لغو شد");
    loadLicenses();
  }catch(e){
    message(e.message);
  }
}
</script>
</body>
</html>

const g2j=(gy,gm,gd)=>{const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let n=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(n/12053);n%=12053;jy+=4*Math.floor(n/1461);n%=1461;if(n>365){jy+=Math.floor((n-1)/365);n=(n-1)%365}return n<186?[jy,1+Math.floor(n/31),1+n%31]:[jy,7+Math.floor((n-186)/30),1+(n-186)%30]},
j2g=(jy,jm,jd)=>{jy+=1595;let n=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(n/146097);n%=146097;if(n>36524){gy+=100*Math.floor(--n/36524);n%=36524;if(n>=365)n++}gy+=4*Math.floor(n/1461);n%=1461;if(n>365){gy+=Math.floor((n-1)/365);n=(n-1)%365}let gd=n+1,gm;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]},

function jalaliMonthDays(m,y){if(m<=6)return 31;if(m<=11)return 30;if(y==null)return 29;const a=j2g(y,1,1),b=j2g(y+1,1,1);return Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2])===366*86400000?30:29}

function dateKey(value){let raw=String(value??'').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[/.]/g,'-');let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let y=+m[1],mo=+m[2],d=+m[3];if(y>=1300&&y<1700){const g=j2g(y,mo,d);[y,mo,d]=g}if(y>=1900&&mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}const dt=new Date(raw);if(!Number.isNaN(dt.getTime()))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');return ''}

let cloudAuthMode='login',cloudAuthSubscription=null,cloudLoading=false;
async function loadCloudBusinesses(){
 const api=window.FactooriCloud;
 if(!api||!cloudSession?.user?.id||!cloudSchemaReady){
  cloudBusinesses=[];
  cloudActiveBusinessId='';
  try{localStorage.removeItem('factoori:active-business')}catch(e){}
  return;
 }
 cloudBusinesses=await api.listBusinesses(cloudSession.user.id);
 // Never silently switch a user's active business. A stale or foreign ID is
 // cleared and the user must explicitly choose from the membership list.
 if(!cloudBusinesses.some(x=>x.id===cloudActiveBusinessId)){
  cloudActiveBusinessId='';
  try{localStorage.removeItem('factoori:active-business')}catch(e){}
 }
 if(cloudActiveBusinessId&&!demoMode){
  try{activateBusinessLocalDatabase(cloudActiveBusinessId)}catch(e){cloudActiveBusinessId='';try{localStorage.removeItem('factoori:active-business')}catch(_){}console.warn('[Factoori local business database]',e)}
 }
}
async function initCloudSession(){
 const api=window.FactooriCloud;if(!api)return;
 try{cloudSession=await api.getSession();if(cloudSession){cloudSchemaReady=await api.getClientHealth();if(cloudSchemaReady)await loadCloudBusinesses()}}catch(e){console.warn('[Factoori cloud session]',e)}
 if(!cloudAuthSubscription)cloudAuthSubscription=api.onAuthStateChange(async(_event,session)=>{
  cloudSession=session;
  try{await loadCloudBusinesses()}catch(e){console.warn('[Factoori business list]',e)}
  if(!lock&&!demoMode)render();
 });
 if(!lock&&!demoMode)render();
}

c"><h2>پرداخت‌ها · ${fa(payments.length)} مورد</h2>${payRows(payments)||'<p class="em">پرداختی ثبت نشده است.</p>'}</div><div class="c"><h2>بدهی‌های قبلی</h2>${db.debt.filter(d=>d.cid===c.id).map(d=>`<div class="li"><div><b>${esc(d.desc||'بدهی قبلی')}</b><small>${dstr(d.dt)}</small></div><div class="ac"><b>${money(d.amt)}</b><button data-a="editdebt" data-id="${d.id}">ویرایش</button></div></div>`).join('')||'<p class="em">بدهی قبلی ثبت نشده است.</p>'}</div>`},prod:()=>`<h1>کالاها</h1><button class="b w100" style="margin:0 0 10px" data-a="newp">+ کالای جدید</button><input id="q" placeholder="جستجوی نام کالا…" style="margin-bottom:10px"><select id="catfilter" style="margin-bottom:10px"><option value="">همه دسته‌ها</option>${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="c"><h2>مدیریت دسته‌بندی‌ها</h2><div class="g"><input id="newCategory" placeholder="نام دسته جدید"><button class="b" data-a="addcategory">افزودن دسته</button></div><small>${db.categories.map(c=>esc(c)).join(' · ')||'هنوز دسته‌ای تعریف نشده'}</small></div><div class="c">${db.prod.length?db.prod.map(p=>`<div class="li" data-s="${esc(p.n+' '+(p.category||''))}" data-cat="${esc(p.category||'')}"><div><b>${esc(p.n)}</b><br><small>${esc(p.category||'بدون دسته')}</small><br><small>خرید ${fa(p.buy)} · فروش ${fa(p.sell)} · سود واحد ${fa(p.sell-p.buy)}<br>موجودی انبار: <span style="color:${p.qty<=0?'var(--dg)':'inherit'}">${fq(p.qty)}</span></small></div><div class="ac"><button data-a="stockadj" data-id="${p.id}">اصلاح موجودی</button><button data-a="ep" data-id="${p.id}">ویرایش</button><button class="dg" data-a="dp" data-id="${p.id}">حذف</button></div></div>`).join(''):'<p class="em">کالایی ثبت نشده.</p>'}</div><div class="c"><h2>تاریخچه تغییرات موجودی</h2>${db.stockMoves.slice().reverse().slice(0,20).map(m=>`<div class="li"><div><b>${esc(db.prod.find(p=>p.id===m.pid)?.n||'کالای حذف‌شده')}</b><br><small>${dstr(m.dt)} · ${esc(m.reason||'تغییر موجودی')}</small></div><b style="color:${m.delta<0?'var(--dg)':'var(--ok)'}">${m.delta>0?'+':''}${fa(m.delta)}</b></div>`).join('')||'<p class="em">تاریخچه‌ای وجود ندارد.</p>'}</div>`,
pf:()=>`<h1>${D.id?'ویرایش کالا':'کالای جدید'}</h1><div class="c">${f('نام کالا','n',D.n)}<div class="g">${f('قیمت خرید','buy',D.buy,'inputmode=numeric')}${f('قیمت فروش','sell',D.sell,'inputmode=numeric')}</div><div><label>دسته‌بندی</label><select data-f="category"><option value="">بدون دسته</option>${db.categories.map(c=>`<option ${D.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${f('تعداد موجود در انبار','qty',D.qty,'inputmode=decimal')}</div><div class="r"><button class="b" data-a="sp">ذخیره</button><button class="b s" data-a="back">انصراف</button></div>`,
pay:()=>{const cash=db.pay.filter(p=>p.kind==="cash"),checks=db.pay.filter(p=>p.kind==="cheque"&&p.status!=="returned"),pending=checks.filter(p=>p.status!=="received");return `<section class="receipts-hero"><div><small>مدیریت مالی · دریافت‌ها</small><h1>مرکز دریافت‌ها</h1><p>پیگیری وجه نقد، چک‌های دریافتی و سوابق مطالبات</p></div><div class="receipts-hero-icon">↙</div></section><div class="receipt-kpis"><div><span>دریافت نقدی</span><b>${money(sum(cash.map(p=>p.amt)))}</b><small>${fa(cash.length)} تراکنش</small></div><div><span>چک‌های معتبر</span><b>${money(sum(checks.map(p=>p.amt)))}</b><small>${fa(checks.length)} فقره</small></div><div><span>در انتظار وصول</span><b>${fa(pending.length)}</b><small>فقره چک</small></div></div><div class="receipt-actions"><button data-a="newpay"><i>＋</i><b>ثبت دریافت جدید</b><small>نقدی یا چک</small></button><button data-a="openpaycash"><i>💵</i><b>دریافت‌های نقدی</b><small>مشاهده گردش نقدی</small></button><button data-a="openpaychecks"><i>▤</i><b>مدیریت چک‌ها</b><small>اطلاعات و تصاویر چک</small></button><button data-a="openpaydebts"><i>📒</i><b>بدهی‌های قبلی</b><small>ثبت و پیگیری مطالبات</small></button></div><section class="receipt-panel"><div class="receipt-panel-head"><div><b>آخرین دریافت‌ها</b><small>جدیدترین تراکنش‌های ثبت‌شده</small></div><button data-a="openpaycash">مشاهده نقدی‌ها ←</button></div>${payRows(db.pay.slice().sort((a,b)=>String(b.dt).localeCompare(String(a.dt))).slice(0,5))}</section>`;},
paycash:()=>{const rows=db.pay.filter(p=>p.kind==="cash");return '<h1>دریافتی‌های نقدی</h1><button class="b w100" data-a="newcash">+ ثبت دریافتی نقدی</button><div class="c"><h2>سوابق دریافت نقدی</h2>'+payRows(rows)+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
paychecks:()=>{const rows=db.pay.filter(p=>p.kind==="cheque");return '<h1>چک‌های دریافتی</h1><button class="b w100" data-a="newcheck">+ ثبت چک دریافتی</button><div class="c"><h2>سوابق چک‌ها</h2>'+payRows(rows)+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
paydebts:()=>{return '<h1>بدهی‌های قبلی مشتریان</h1><button class="b w100" data-a="newdebt">+ ثبت بدهی قبلی</button><div class="c"><h2>بدهی‌های ثبت‌شده</h2>'+(db.debt.length?db.debt.slice().reverse().map(d=>'<div class="li"><div><b>'+esc(C(d.cid).n)+'</b><br><small>'+dstr(d.dt)+' · '+esc(d.desc||"بدهی قبلی")+'</small></div><div style="text-align:left"><b>'+money(d.amt)+'</b><div class="ac"><button data-a="editdebt" data-id="'+d.id+'">ویرایش</button><button class="dg" data-a="deletede_bt" data-id="'+d.id+'">حذف</button></div></div></div>').join(""):'<p class="em">بدهی قبلی ثبت نشده است.</p>')+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
debtf:()=>`<h1>${D.id?'ویرایش بدهی قبلی':'ثبت بدهی قبلی مشتری'}</h1><div class="c"><div><label>مشتری</label>${sel('cid',db.cust,D.cid,'انتخاب مشتری…')}</div>${f('مبلغ بدهی','amt',D.amt,'inputmode=numeric')}<div><label>تاریخ بدهی</label>${jpick('dt')}</div>${f('توضیحات (اختیاری)','desc',D.desc)}</div><div class="r"><button class="b" data-a="sdebt">${D.id?"ذخیره تغییرات":"ثبت بدهی قبلی"}</button><button class="b s" data-a="back">انصراف</button></div>`,
payf:()=>`<section class="receipt-form-head"><small>مدیریت دریافت‌ها</small><h1>${D.id?'ویرایش دریافت':'ثبت دریافت جدید'}</h1><p>اطلاعات تراکنش را با دقت ثبت کنید</p></section><div class="receipt-form-card"><div class="receipt-form-section"><b>اطلاعات اصلی دریافت</b><div><label>مشتری</label>${sel('cid',db.cust,D.cid,'انتخاب مشتری…')}</div><div><label>روش دریافت</label><select data-f="kind"><option value="cash" ${D.kind==='cash'?'selected':''}>نقدی</option><option value="cheque" ${D.kind==='cheque'?'selected':''}>چک</option></select></div><div class="g"><div>${f('مبلغ دریافت','amt',D.amt,'inputmode=numeric')}</div><div><label>تاریخ دریافت</label>${jpick('dt')}</div></div>${f('شماره پیگیری / مرجع (اختیاری)','tracking',D.tracking)}</div>${D.kind==='cheque'?`<div class="cheque-form-section"><div class="cheque-section-title"><span>▤</span><div><b>مشخصات کامل چک</b><small>اطلاعات روی برگه چک را وارد کنید</small></div></div><div class="g"><div>${f('شماره چک','no',D.no)}</div><div>${f('شناسه صیادی ۱۶ رقمی','sayad',D.sayad,'inputmode=numeric maxlength="16"')}</div></div><div class="g"><div>${f('نام بانک','bank',D.bank,'placeholder="مثلاً ملت"')}</div><div>${f('شعبه بانک','branch',D.branch,'placeholder="نام یا کد شعبه"')}</div></div><div class="g"><div>${f('شماره حساب مبدأ (اختیاری)','accountNo',D.accountNo,'inputmode=numeric')}</div><div>${f('نوع چک','chequeType',D.chequeType||'عادی','placeholder="عادی / صیادی / تضمینی"')}</div></div><div class="g"><div>${f('صاحب حساب','accountHolder',D.accountHolder)}</div><div>${f('در وجه / دریافت‌کننده','payee',D.payee)}</div></div><div><label>تاریخ سررسید</label>${jpick('cdt')}</div><div><label>وضعیت چک</label><select data-f="status"><option value="pending" ${D.status!=='received'&&D.status!=='returned'?'selected':''}>در انتظار سررسید</option><option value="received" ${D.status==='received'?'selected':''}>وصول‌شده</option><option value="returned" ${D.status==='returned'?'selected':''}>برگشتی</option></select></div><div class="cheque-photo-box"><div><b>تصویر برگه چک</b><small>از چک عکس بگیرید یا تصویر آن را از گالری انتخاب کنید</small></div><label class="cheque-camera-button">📷 عکس گرفتن / انتخاب تصویر<input type="file" accept="image/*" data-cheque-image hidden></label>${D.chequeImage?`<div class="cheque-photo-preview"><img src="${D.chequeImage}" alt="تصویر چک"><button type="button" class="b s" data-a="viewchequeimage">مشاهده تصویر</button><button type="button" class="b s dg" data-a="removechequeimage">حذف تصویر</button></div>`:'<div class="cheque-photo-empty">هنوز تصویری برای این چک ثبت نشده است</div>'}</div></div>`:''}${f('توضیحات تکمیلی (اختیاری)','note',D.note)}${D.kind==='cash'&&advArray('accounts').length?advAccountField('accountId','واریز به حساب',D.accountId):''}</div><div class="r"><button class="b" data-a="spay">${D.id?'ذخیره تغییرات':'ثبت دریافت'}</button><button class="b s" data-a="back">انصراف</button></div>` ,
expense:()=>`<h1>هزینه‌ها و بستانکاران</h1><div class="r"><button class="b" data-a="newexpense">+ ثبت هزینه</button><button class="b s" data-a="newcreditor">+ ثبت بستانکار</button></div><div class="metric-grid"><div class="metric"><small>مجموع هزینه‌ها</small><b>${money(sum(db.expenses.map(e=>e.amt)))}</b></div><div class="metric"><small>مانده بدهی به بستانکاران</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div></div><div class="c"><h2>هزینه‌های مؤثر بر سود</h2><small style="display:block;color:var(--mu);margin-bottom:8px">بهای خرید کالا جداگانه در سود فروش محاسبه می‌شود؛ پرداخت بدهی بستانکاران نیز هزینه جدید محسوب نمی‌شود.</small><input id="expenseSearch" placeholder="جست‌وجوی عنوان، دسته یا توضیحات هزینه…"><div id="expenseRows">${db.expenses.slice().reverse().map(e=>`<div class="li" data-expense-row data-s="${esc(e.title+' '+(e.category||'')+' '+(e.note||''))}"><div style="min-width:0"><b>${esc(e.title)}</b><br><small>${dstr(e.dt)} · ${esc(e.category||'متفرقه')} · ${esc(e.note||'بدون توضیح')}</small></div><div style="text-align:left;flex:none"><b>${money(e.amt)}</b><div class="ac"><button data-a="editexpense" data-id="${e.id}">ویرایش</button><button class="dg" data-a="deleteexpense" data-id="${e.id}">حذف</button></div></div></div>`).join('')||'<p class="em">هزینه‌ای ثبت نشده است.</p>'}</div></div><div class="c"><h2>بستانکاران ما</h2><input id="creditorSearch" placeholder="جست‌وجوی نام یا توضیحات بستانکار…"><div class="metric-grid"><div class="metric"><small>مانده کل بدهی</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div><div class="metric"><small>تعداد بستانکاران</small><b>${fa(db.creditors.length)}</b></div></div>${creditorRows()}</div>`,
creditors:()=>`<h1>بستانکاران</h1><div class="r"><button class="b" data-a="newcreditor">+ ثبت بستانکار جدید</button><button class="b s" data-a="openexpenses">مدیریت هزینه‌ها</button></div><div class="metric-grid"><div class="metric"><small>مانده کل بدهی</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div><div class="metric"><small>تعداد بستانکاران</small><b>${fa(db.creditors.length)}</b></div></div><div class="c"><h2>فهرست بستانکاران</h2><input id="creditorSearch" placeholder="جست‌وجوی نام یا توضیحات بستانکار…">${creditorRows()}</div>`,

async function exp(k){
 if(denyDemo())return;
 const paperEl=$('paper');if(!paperEl)return toast('فاکتور برای خروجی پیدا نشد');
 $('ov').scrollTop=0;toast('در حال آماده‌سازی خروجی…');
 try{
  if(typeof window.html2canvas!=='function')throw new Error('کتابخانه ساخت تصویر بارگذاری نشده است');
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(k==='png'&&!licenseActive)return toast('در نسخه رایگان خروجی فاکتور فقط PDF است.');
  const c=await window.html2canvas(paperEl,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,paperEl.scrollWidth),onclone:doc=>{const el=doc.getElementById('paper');if(el){el.style.width=paperEl.scrollWidth+'px';el.style.maxWidth='none';el.style.overflow='visible';}}});
  let bl,nm='factori-invoice';
  if(k==='png'){
   bl=await new Promise((resolve,reject)=>c.toBlob(x=>x?resolve(x):reject(new Error('تبدیل تصویر ناموفق بود')),'image/png'));
   nm+='.png';
  }else{
   const JsPDF=window.jspdf&&window.jspdf.jsPDF;if(!JsPDF)throw new Error('کتابخانه PDF بارگذاری نشده است');
   const w=210,h=c.height*w/c.width,p=new JsPDF({unit:'mm',format:h>297?[w,h]:'a4',orientation:'portrait',compress:true});
   p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h);bl=p.output('blob');nm+='.pdf';
  }
  if(!bl||!bl.size)throw new Error('فایل خروجی خالی ساخته شد');
  const cp=window.Capacitor;
  if(cp&&cp.isNativePlatform&&cp.isNativePlatform()){
   const P=cp.Plugins||{},FS=P.Filesystem,SH=P.Share;
   if(!FS||!SH)throw new Error('دسترسی ذخیره‌سازی یا اشتراک‌گذاری اندروید در دسترس نیست');
   const b64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=()=>reject(new Error('خواندن فایل خروجی ناموفق بود'));fr.readAsDataURL(bl)});
   const saved=await FS.writeFile({path:nm,data:b64,directory:'CACHE'});
   if(!saved||!saved.uri)throw new Error('ذخیره فایل در گوشی ناموفق بود');
   await SH.share({title:nm,text:'خروجی فاکتور فاکتوری',url:saved.uri,dialogTitle:'ذخیره یا ارسال فاکتور'});
   toast('فاکتور آماده شد');return;
  }
  const fl=new File([bl],nm,{type:bl.type});
  if(navigator.canShare&&navigator.canShare({files:[fl]})){try{await navigator.share({files:[fl]});return}catch(e){if(e.name==='AbortError')return}}
  const url=URL.createObjectURL(bl),a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('فایل خروجی آماده شد');
 }catch(e){console.error('[Factori export]',e);toast('خطای خروجی: '+(e&&e.message?e.message:'نامشخص'))}
}

smshelp:()=>{$('ov').innerHTML=`<div class="picker-shell"><div class="picker-top"><div class="r"><b style="flex:2">آموزش راه‌اندازی پیامک فراز</b><button class="b s" data-a="cls">بستن</button></div></div><div class="c"><h2>این بخش چه کاری انجام می‌دهد؟</h2><p>با راه‌اندازی پیامک، فاکتوری می‌تواند پس از صدور فاکتور و هنگام ثبت دریافت وجه، به‌صورت خودکار برای مشتری پیامک بفرستد. برای فعال شدن این امکان، باید حساب فراز اس‌ام‌اس را به فاکتوری متصل کنید و دو پترن جداگانه بسازید.</p><h2>مرحله ۱: ثبت‌نام در فراز اس‌ام‌اس</h2><p>در گوگل عبارت «فراز اس‌ام‌اس» را جست‌وجو کنید، وارد سایت شوید و ثبت‌نام کنید. سپس وارد پنل کاربری خود شوید.</p><h2>مرحله ۲: دریافت کلید وب‌سرویس</h2><ol style="padding-right:22px"><li>از منوی سمت راست پنل، گزینه «وب‌سرویس» را باز کنید.</li><li>گزینه «کلید وب‌سرویس» را انتخاب کنید.</li><li>یک کلید جدید بسازید و آن را کپی کنید.</li><li>به فاکتوری برگردید و کلید را در قسمت «توکن API فراز» قرار دهید.</li></ol><p class="page-note">کلید وب‌سرویس مخصوص حساب شماست؛ آن را در اختیار دیگران قرار ندهید.</p><h2>مرحله ۳: ساخت پترن پیامک صدور فاکتور</h2><ol style="padding-right:22px"><li>از منوی سمت راست فراز، گزینه «پترن» را باز کنید و یک پترن جدید بسازید.</li><li>متن زیر را در متن پترن قرار دهید:</li></ol><pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">مشتری گرامی %name%\nفاکتور شماره %factor% به مبلغ %total% ثبت شد.\nمبلغ پرداختی: %paid%\nمانده حساب: %remain%\n%brand%</pre><p>متغیرهای پترن را مطابق جدول زیر تعریف کنید:</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:right;padding:7px;border-bottom:1px solid var(--bd)">نام متغیر</th><th style="text-align:right;padding:7px;border-bottom:1px solid var(--bd)">نوع مقدار</th><th style="padding:7px;border-bottom:1px solid var(--bd)">حداکثر کاراکتر</th></tr></thead><tbody>${[['name','رشته متنی',40],['factor','رشته متنی',15],['total','عددی',15],['paid','عددی',15],['remain','عددی',15],['brand','رشته متنی',40]].map(r=>`<tr><td dir="ltr" style="padding:7px;border-bottom:1px solid var(--bd)">%${r[0]}%</td><td style="padding:7px;border-bottom:1px solid var(--bd)">${r[1]}</td><td style="text-align:center;padding:7px;border-bottom:1px solid var(--bd)">${r[2]}</td></tr>`).join('')}</tbody></table></div><ol start="3" style="padding-right:22px"><li>پترن را ذخیره کنید. سپس روی پترن ساخته‌شده بزنید و کد اختصاصی آن را کپی کنید.</li><li>کد را در فاکتوری، داخل قسمت «کد پترن صدور فاکتور» قرار دهید.</li></ol><h2>مرحله ۴: ساخت پترن پیامک ثبت دریافتی</h2><p>دوباره در بخش «پترن» یک پترن جدید بسازید و متن زیر را قرار دهید:</p><pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">مشتری گرامی %name%\nدریافت وجه به مبلغ %amount% ثبت شد.\nتاریخ: %date%\nروش پرداخت: %method%\nمانده حساب: %remain%\n%brand%</pre><p>متغیرهای این پترن را مطابق جدول زیر تعریف کنید:</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:right;padding:7px;border-bottom:1px solid var(--bd)">نام متغیر</th><th style="text-align:right;padding:7px;border-bottom:1px solid var(--bd)">نوع مقدار</th><th style="padding:7px;border-bottom:1px solid var(--bd)">حداکثر کاراکتر</th></tr></thead><tbody>${[['name','رشته متنی',40],['amount','عددی',15],['date','رشته متنی',15],['method','رشته متنی',15],['remain','عددی',15],['brand','رشته متنی',40]].map(r=>`<tr><td dir="ltr" style="padding:7px;border-bottom:1px solid var(--bd)">%${r[0]}%</td><td style="padding:7px;border-bottom:1px solid var(--bd)">${r[1]}</td><td style="text-align:center;padding:7px;border-bottom:1px solid var(--bd)">${r[2]}</td></tr>`).join('')}</tbody></table></div><ol style="padding-right:22px"><li>پترن را ذخیره کنید و روی آن بزنید تا کد اختصاصی نمایش داده شود.</li><li>کد را کپی کنید و در فاکتوری، داخل قسمت «کد پترن ثبت دریافتی» قرار دهید.</li></ol><h2>مرحله ۵: وارد کردن شماره عمومی فراز</h2><p>در قسمت «شماره عمومی فراز اس‌ام‌اس» این شماره را وارد کنید:</p><p dir="ltr" style="font-size:18px;font-weight:800;text-align:center">90008361</p><h2>مرحله ۶: آزمایش ارسال پیامک</h2><ol style="padding-right:22px"><li>شماره موبایل خودتان را در قسمت شماره تست وارد کنید.</li><li>دکمه «ارسال پیامک آزمایشی» را بزنید.</li><li>پیامک آزمایشی را روی گوشی خود بررسی کنید.</li></ol><h2>مرحله ۷: فعال‌سازی ارسال خودکار</h2><p>پس از موفقیت‌آمیز بودن آزمایش، گزینه‌های ارسال خودکار پس از صدور فاکتور و پس از ثبت دریافت را فعال و تنظیمات را ذخیره کنید.</p><p class="page-note">نام برند فرستنده برای هر نصب باید مطابق حساب و پترن همان خریدار تنظیم شود؛ نام برند نمونه در برنامه برای همه کاربران ثابت نیست.</p><h2>نیاز به راهنمایی دارید؟</h2><p>اگر در ساخت پترن یا راه‌اندازی سرویس پیامک مشکل داشتید، از طریق واتساپ با پشتیبانی تماس بگیرید:</p><p dir="ltr" style="font-size:18px;font-weight:800;text-align:center">09397050966</p><button class="b w100" data-a="cls">متوجه شدم</button></div></div>`;$('ov').className='on'},

checkpatterns:async()=>{try{const cfg=await readSmsForm();toast('در حال بررسی پترن صدور فاکتور…');const a=await window.FactoriLicenseApi.getFarazPatternDetails({settings:cfg,patternCode:cfg.invoicePattern});const aNames=(a.attributes||[]).map(x=>x.name);const b=await window.FactoriLicenseApi.getFarazPatternDetails({settings:cfg,patternCode:cfg.paymentPattern});const bNames=(b.attributes||[]).map(x=>x.name);const issues=[];if(cfg.brandName&&!aNames.includes('brand'))issues.push('پترن فاکتور متغیر brand ندارد');if(cfg.brandName&&!bNames.includes('brand'))issues.push('پترن دریافت وجه متغیر brand ندارد');toast(issues.length?issues.join('؛ '):'پترن‌ها بررسی شدند. متغیرهای فاکتور: '+aNames.join('، ')+' | دریافت وجه: '+bNames.join('، '))}catch(e){toast('بررسی پترن ناموفق: '+(e.message||e))}},sendtest:async()=>{try{const cfg=await readSmsForm();if(!/^(09\d{9}|\+989\d{9})$/.test(cfg.testPhone))throw new Error('شماره موبایل آزمایشی را با 09 وارد کن');await sendCustomerPattern('invoice',{n:'آزمایش فاکتوری',ph:cfg.testPhone},{no:'1000',total:1000,paid:500,remain:500});toast('پیامک آزمایشی به فراز ارسال شد')}catch(e){toast('آزمایش ناموفق: '+(e.message||e))}},
demo:()=>enterDemo(),exitdemo:()=>exitDemo(),licenseui:()=>licenseUi(),
licensecheck:async()=>{
 const code=$('licenseCode')?.value?.trim();
 const status=$('licenseStatus'),button=$('licenseCheckBtn');
 if(!code){if(status)status.textContent='کد لایسنس را وارد کنید.';return}
 if(!window.FactoriLicenseApi){if(status)status.textContent='سرویس فعال‌سازی بارگذاری نشده است. برنامه را کامل ببندید و دوباره باز کنید.';return}
 if(button?.disabled)return;
 if(button){button.disabled=true;button.textContent='در حال بررسی...'}
 if(status){status.style.color='var(--mu)';status.textContent='در حال اتصال به سرور و بررسی کد؛ لطفاً تا پایان بررسی از صفحه خارج نشوید.'}
 try{
  const result=await window.FactoriLicenseApi.activate(code,stage=>{
   if(status)status.textContent='مرحله جاری: '+stage+'؛ لطفاً منتظر بمانید.';
  });
  // activate() verifies the signed token and confirms it was saved. Do not
  // perform a second native Keystore round-trip here: it can hang indefinitely.
  if(!result?.ok)throw new Error('فعال‌سازی لایسنس موفق نبود.');
  licenseActive=true;
  if(demoMode){demoMode=false;db=realDb;D={};IV=null;}
  $('ov').className='';
  lk=db.pw?'in':'set';lock=true;render();
  toast('لایسنس با موفقیت فعال شد.');
 }catch(error){
  const message=error?.message||'فعال‌سازی ناموفق بود.';
  if(status){status.style.color='var(--dg)';status.textContent='خطا: '+message}
  console.error('[Factori activation UI]',error);
 }finally{
  if(button){button.disabled=false;button.textContent='تلاش دوباره برای فعال‌سازی'}
 }
},

  // ورود به نسخه رایگان مستقل از وضعیت خرید و اتصال به سرویس لایسنس است.
  if(demoMode){demoMode=false;db=realDb;D={};IV=null;}

  lk=db.pw?'in':'set';
  lock=true;
  render();
 },

 const o=db.inv.find(i=>i.id==D.id);const required={};it.forEach(r=>required[r.pid]=(required[r.pid]||0)+num(r.q));if(warehouseEnabled()&&!D.warehouseId)return toast('انبار محل خروج کالا را انتخاب کن');for(const pid in required){const p=db.prod.find(x=>x.id===pid),oldQty=o?sum(o.items.filter(x=>x.pid===pid).map(x=>x.q)):0;if(!p||num(p.qty)+oldQty<required[pid])return toast('موجودی کالای '+(p?.n||'انتخاب‌شده')+' کافی نیست');if(warehouseEnabled()){const oldWarehouseQty=o&&o.warehouseId===D.warehouseId?sum(o.items.filter(x=>x.pid===pid).map(x=>num(x.q))):0;if(warehouseQty(pid,D.warehouseId,oldWarehouseQty)<required[pid])return toast('موجودی این کالا در انبار انتخاب‌شده کافی نیست')}}if(o){if(o.warehouseId)o.items.forEach(r=>changeWarehouseStock(r.pid,o.warehouseId,num(r.q)));stk(o.items,1)}

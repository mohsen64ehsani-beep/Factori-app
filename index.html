function creditorBalance(id){const c=db.creditors.find(x=>x.id===id);return num(c?.amount)-sum(db.creditorPayments.filter(p=>p.creditorId===id).map(p=>p.amount))}
function receivedChequeRemaining(id){const p=db.pay.find(x=>x.id===id);return Math.max(0,num(p?.amt)-sum(db.creditorPayments.filter(x=>x.method==="cheque"&&x.chequeSource==="received"&&x.sourcePaymentId===id).map(x=>x.amount)))}
function dateKey(value){let raw=String(value??'').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[/.]/g,'-');let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let y=+m[1],mo=+m[2],d=+m[3];if(y>=1300&&y<1700){const g=j2g(y,mo,d);[y,mo,d]=g}if(y>=1900&&mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}const dt=new Date(raw);if(!Number.isNaN(dt.getTime()))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');return ''}
function weekChart(){const byDay=new Map(),todayKey=dateKey(today()),base=new Date(todayKey+'T12:00:00');for(let i=6;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');byDay.set(key,{key,label:d.toLocaleDateString('fa-IR',{weekday:'short'}),amount:0})}for(const inv of db.inv){const k=dateKey(inv.dt);if(byDay.has(k))byDay.get(k).amount+=tot(inv)}for(const inv of db.serviceInv){const k=dateKey(inv.dt);if(byDay.has(k))byDay.get(k).amount+=serviceTotal(inv)}const days=[...byDay.values()],max=Math.max(1,...days.map(x=>x.amount));return days.map(x=>`<div class="week-col" title="${dstr(x.key)} · ${money(x.amount)}"><b style="font-size:10px">${x.amount?fa(x.amount):'۰'}</b><div class="week-bar" style="height:${x.amount?Math.max(7,x.amount/max*70):3}px;opacity:${x.amount?1:.25}"></div><small>${x.label}</small></div>`).join('')}
function creditorRows(){return db.creditors.slice().reverse().map(c=>{const b=creditorBalance(c.id);return `<div class="creditor-card" data-s="${esc(c.name+' '+(c.note||''))}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.name)}</b><b style="color:${b>0?"var(--dg)":"var(--ok)"}">${money(b)}</b></div><small>${dstr(c.dt)} · ${esc(c.note||"بستانکار")}</small><div class="ac creditor-actions"><button data-a="creditorhistory" data-id="${c.id}">مشاهده</button><button data-a="editcreditor" data-id="${c.id}">ویرایش</button><button class="dg" data-a="deletecreditor" data-id="${c.id}">حذف</button><button data-a="newcreditorpayment" data-id="${c.id}">ثبت پرداخت</button></div></div>`}).join("")||'<p class="em">هنوز بستانکاری ثبت نشده است.</p>'}

cd:()=>{const c=C(v.id),b=bal(c.id);return `<h1>${esc(c.n)}</h1><div class="c">${c.ph?'📞 '+esc(c.ph)+'<br>':''}${c.ad?esc(c.ad)+'<br>':''}${c.code?'کد: '+esc(c.code):''}<div class="st ${b>0?'neg':'pos'}" style="margin-top:10px"><small>مانده حساب (بدهکار)</small><b>${money(b)}</b></div><div class="r"><button class="b" data-a="newinvc" data-id="${c.id}">فاکتور جدید</button><button class="b s" data-a="payc" data-id="${c.id}">ثبت پرداخت</button><button class="b s" data-a="stmt" data-id="${c.id}">صورتحساب کلی</button><button class="b s" data-a="ecust" data-id="${c.id}">ویرایش</button><button class="b dg" data-a="dcust" data-id="${c.id}">حذف</button></div></div><div class="c"><h2>فاکتورهای خدمات</h2>${db.serviceInv.filter(i=>i.cid===c.id).map(i=>`<div class="li"><span>خدمات #${fa(i.no)} · ${dstr(i.dt)}</span><b>${money(serviceTotal(i))}</b><button data-a="vservice" data-id="${i.id}">مشاهده</button></div>`).join('')||'<p class="em">موردی ثبت نشده.</p>'}</div><div class="c"><h2>بدهی‌های قبلی</h2>${db.debt.filter(d=>d.cid===c.id).map(d=>`<div class="li"><div><span>${dstr(d.dt)} · ${esc(d.desc||'بدهی قبلی')}</span><br><b>${money(d.amt)}</b></div><div class="ac"><button data-a="editdebt" data-id="${d.id}">ویرایش</button><button class="dg" data-a="deletede_bt" data-id="${d.id}">حذف</button></div></div>`).join('')||'<p class="em">موردی ثبت نشده.</p>'}</div><div class="c"><h2>فاکتورها</h2>${invRows(db.inv.filter(i=>i.cid===c.id).reverse())}</div><div class="c"><h2>پرداخت‌ها</h2>${payRows(db.pay.filter(p=>p.cid===c.id&&p.status!=='returned'))}</div>`},
prod:()=>`<h1>کالاها</h1><button class="b w100" style="margin:0 0 10px" data-a="newp">+ کالای جدید</button><input id="q" placeholder="جستجوی نام کالا…" style="margin-bottom:10px"><select id="catfilter" style="margin-bottom:10px"><option value="">همه دسته‌ها</option>${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="c"><h2>مدیریت دسته‌بندی‌ها</h2><div class="g"><input id="newCategory" placeholder="نام دسته جدید"><button class="b" data-a="addcategory">افزودن دسته</button></div><small>${db.categories.map(c=>esc(c)).join(' · ')||'هنوز دسته‌ای تعریف نشده'}</small></div><div class="c">${db.prod.length?db.prod.map(p=>`<div class="li" data-s="${esc(p.n+' '+(p.category||''))}" data-cat="${esc(p.category||'')}"><div><b>${esc(p.n)}</b><br><small>${esc(p.category||'بدون دسته')}</small><br><small>خرید ${fa(p.buy)} · فروش ${fa(p.sell)} · سود واحد ${fa(p.sell-p.buy)}<br>موجودی انبار: <span style="color:${p.qty<=0?'var(--dg)':'inherit'}">${fq(p.qty)}</span></small></div><div class="ac"><button data-a="stockadj" data-id="${p.id}">اصلاح موجودی</button><button data-a="ep" data-id="${p.id}">ویرایش</button><button class="dg" data-a="dp" data-id="${p.id}">حذف</button></div></div>`).join(''):'<p class="em">کالایی ثبت نشده.</p>'}</div><div class="c"><h2>تاریخچه تغییرات موجودی</h2>${db.stockMoves.slice().reverse().slice(0,20).map(m=>`<div class="li"><div><b>${esc(db.prod.find(p=>p.id===m.pid)?.n||'کالای حذف‌شده')}</b><br><small>${dstr(m.dt)} · ${esc(m.reason||'تغییر موجودی')}</small></div><b style="color:${m.delta<0?'var(--dg)':'var(--ok)'}">${m.delta>0?'+':''}${fa(m.delta)}</b></div>`).join('')||'<p class="em">تاریخچه‌ای وجود ندارد.</p>'}</div>`,
pf:()=>`<h1>${D.id?'ویرایش کالا':'کالای جدید'}</h1><div class="c">${f('نام کالا','n',D.n)}<div class="g">${f('قیمت خرید','buy',D.buy,'inputmode=numeric')}${f('قیمت فروش','sell',D.sell,'inputmode=numeric')}</div><div><label>دسته‌بندی</label><select data-f="category"><option value="">بدون دسته</option>${db.categories.map(c=>`<option ${D.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${f('تعداد موجود در انبار','qty',D.qty,'inputmode=decimal')}</div><div class="r"><button class="b" data-a="sp">ذخیره</button><button class="b s" data-a="back">انصراف</button></div>`,
pay:()=>{const cash=db.pay.filter(p=>p.kind==="cash"),checks=db.pay.filter(p=>p.kind==="cheque"&&p.status!=="returned");return '<h1>مدیریت دریافت‌ها</h1><div class="metric-grid"><div class="metric"><small>دریافت نقدی</small><b>'+money(sum(cash.map(p=>p.amt)))+'</b><small>'+fa(cash.length)+' ثبت</small></div><div class="metric"><small>چک‌های دریافتی</small><b>'+money(sum(checks.map(p=>p.amt)))+'</b><small>'+fa(checks.length)+' چک معتبر</small></div></div><div class="qa"><button data-a="openpaycash"><i>💵</i>دریافتی نقدی</button><button data-a="openpaychecks"><i>🧾</i>چک‌های دریافتی</button><button data-a="openpaydebts"><i>📒</i>بدهی‌های قبلی</button></div><div class="c"><small>برای مشاهده سوابق یا ثبت اطلاعات، یکی از سه بخش بالا را انتخاب کن.</small></div>'},
paycash:()=>{const rows=db.pay.filter(p=>p.kind==="cash");return '<h1>دریافتی‌های نقدی</h1><button class="b w100" data-a="newcash">+ ثبت دریافتی نقدی</button><div class="c"><h2>سوابق دریافت نقدی</h2>'+payRows(rows)+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
paychecks:()=>{const rows=db.pay.filter(p=>p.kind==="cheque");return '<h1>چک‌های دریافتی</h1><button class="b w100" data-a="newcheck">+ ثبت چک دریافتی</button><div class="c"><h2>سوابق چک‌ها</h2>'+payRows(rows)+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
paydebts:()=>{return '<h1>بدهی‌های قبلی مشتریان</h1><button class="b w100" data-a="newdebt">+ ثبت بدهی قبلی</button><div class="c"><h2>بدهی‌های ثبت‌شده</h2>'+(db.debt.length?db.debt.slice().reverse().map(d=>'<div class="li"><div><b>'+esc(C(d.cid).n)+'</b><br><small>'+dstr(d.dt)+' · '+esc(d.desc||"بدهی قبلی")+'</small></div><div style="text-align:left"><b>'+money(d.amt)+'</b><div class="ac"><button data-a="editdebt" data-id="'+d.id+'">ویرایش</button><button class="dg" data-a="deletede_bt" data-id="'+d.id+'">حذف</button></div></div></div>').join(""):'<p class="em">بدهی قبلی ثبت نشده است.</p>')+'</div><button class="b s w100" data-a="openpaymenu">بازگشت به دریافت‌ها</button>'},
debtf:()=>`<h1>${D.id?'ویرایش بدهی قبلی':'ثبت بدهی قبلی مشتری'}</h1><div class="c"><div><label>مشتری</label>${sel('cid',db.cust,D.cid,'انتخاب مشتری…')}</div>${f('مبلغ بدهی','amt',D.amt,'inputmode=numeric')}<div><label>تاریخ بدهی</label>${jpick('dt')}</div>${f('توضیحات (اختیاری)','desc',D.desc)}</div><div class="r"><button class="b" data-a="sdebt">${D.id?"ذخیره تغییرات":"ثبت بدهی قبلی"}</button><button class="b s" data-a="back">انصراف</button></div>`,
payf:()=>'<h1>'+(D.id?'ویرایش دریافت':'ثبت دریافت')+'</h1><div class="c"><div><label>مشتری</label>'+sel('cid',db.cust,D.cid,'انتخاب مشتری…')+'</div><div><label>نوع دریافت</label><select data-f="kind"><option value="cash" '+(D.kind==='cash'?'selected':'')+'>نقدی</option><option value="cheque" '+(D.kind==='cheque'?'selected':'')+'>چک</option></select></div>'+f('مبلغ','amt',D.amt,'inputmode=numeric')+'<div><label>تاریخ دریافت</label>'+jpick('dt')+'</div>'+f('شماره پیگیری (اختیاری)','tracking',D.tracking)+(D.kind==='cheque'?'<div class="chq"><b>اطلاعات چک</b>'+f('شماره چک','no',D.no)+f('شناسه صیاد','sayad',D.sayad,'inputmode=numeric')+'<div><label>تاریخ سررسید</label>'+jpick('cdt')+'</div>'+f('بانک (اختیاری)','bank',D.bank)+'<div><label>وضعیت چک</label><select data-f="status"><option value="pending" '+(D.status!=='received'&&D.status!=='returned'?'selected':'')+'>در انتظار سررسید</option><option value="received" '+(D.status==='received'?'selected':'')+'>وصول‌شده</option><option value="returned" '+(D.status==='returned'?'selected':'')+'>برگشتی</option></select></div></div>':'')+f('توضیحات (اختیاری)','note',D.note)+(D.kind==='cash'&&advArray('accounts').length?advAccountField('accountId','واریز به حساب',D.accountId):'')+'</div><div class="r"><button class="b" data-a="spay">'+(D.id?'ذخیره تغییرات':'ثبت دریافت')+'</button><button class="b s" data-a="back">انصراف</button></div>',
expense:()=>`<h1>هزینه‌ها و بستانکاران</h1><div class="r"><button class="b" data-a="newexpense">+ ثبت هزینه</button><button class="b s" data-a="newcreditor">+ ثبت بستانکار</button></div><div class="metric-grid"><div class="metric"><small>مجموع هزینه‌ها</small><b>${money(sum(db.expenses.map(e=>e.amt)))}</b></div><div class="metric"><small>مانده بدهی به بستانکاران</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div></div><div class="c"><h2>هزینه‌های مؤثر بر سود</h2><small style="display:block;color:var(--mu);margin-bottom:8px">بهای خرید کالا جداگانه در سود فروش محاسبه می‌شود؛ پرداخت بدهی بستانکاران نیز هزینه جدید محسوب نمی‌شود.</small><input id="expenseSearch" placeholder="جست‌وجوی عنوان، دسته یا توضیحات هزینه…"><div id="expenseRows">${db.expenses.slice().reverse().map(e=>`<div class="li" data-expense-row data-s="${esc(e.title+' '+(e.category||'')+' '+(e.note||''))}"><div style="min-width:0"><b>${esc(e.title)}</b><br><small>${dstr(e.dt)} · ${esc(e.category||'متفرقه')} · ${esc(e.note||'بدون توضیح')}</small></div><div style="text-align:left;flex:none"><b>${money(e.amt)}</b><div class="ac"><button data-a="editexpense" data-id="${e.id}">ویرایش</button><button class="dg" data-a="deleteexpense" data-id="${e.id}">حذف</button></div></div></div>`).join('')||'<p class="em">هزینه‌ای ثبت نشده است.</p>'}</div></div><div class="c"><h2>بستانکاران ما</h2><input id="creditorSearch" placeholder="جست‌وجوی نام یا توضیحات بستانکار…"><div class="metric-grid"><div class="metric"><small>مانده کل بدهی</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div><div class="metric"><small>تعداد بستانکاران</small><b>${fa(db.creditors.length)}</b></div></div>${creditorRows()}</div>`,
creditors:()=>`<h1>بستانکاران</h1><div class="r"><button class="b" data-a="newcreditor">+ ثبت بستانکار جدید</button><button class="b s" data-a="openexpenses">مدیریت هزینه‌ها</button></div><div class="metric-grid"><div class="metric"><small>مانده کل بدهی</small><b>${money(sum(db.creditors.map(c=>creditorBalance(c.id))))}</b></div><div class="metric"><small>تعداد بستانکاران</small><b>${fa(db.creditors.length)}</b></div></div><div class="c"><h2>فهرست بستانکاران</h2><input id="creditorSearch" placeholder="جست‌وجوی نام یا توضیحات بستانکار…">${creditorRows()}</div>`,
expensef:()=>`<h1>${D.id?'ویرایش هزینه':'ثبت هزینه جاری'}</h1><div class="c"><small style="color:var(--mu)">بهای خرید کالا را اینجا ثبت نکن؛ بهای خرید در محاسبه سود فروش کالا لحاظ شده است.</small>${f('عنوان هزینه','title',D.title)}<div class="g">${f('مبلغ','amt',D.amt,'inputmode=numeric')}<div><label>دسته هزینه</label><select data-f="category"><option ${D.category==='اجاره'?'selected':''}>اجاره</option><option ${D.category==='حمل‌ونقل'?'selected':''}>حمل‌ونقل</option><option ${D.category==='حقوق'?'selected':''}>حقوق</option><option ${D.category==='تعمیرات'?'selected':''}>تعمیرات</option><option ${D.category==='ابزار'?'selected':''}>ابزار</option><option ${!D.category||D.category==='متفرقه'?'selected':''}>متفرقه</option></select></div></div><div><label>تاریخ</label>${jpick('dt')}</div>${f('توضیحات','note',D.note)}${advArray('accounts').length?advAccountField('accountId','پرداخت از حساب',D.accountId):''}</div><div class="r"><button class="b" data-a="sexpense">${D.id?'ذخیره تغییرات':'ثبت هزینه'}</button><button class="b s" data-a="back">انصراف</button></div>`,
creditorf:()=>`<h1>${D.id?'ویرایش بستانکار':'ثبت بستانکار'}</h1><div class="c">${f('نام شخص یا شرکت','name',D.name)}${f('مبلغ طلب اولیه','amount',D.amount,'inputmode=numeric')}<div><label>تاریخ ثبت</label>${jpick('dt')}</div>${f('توضیحات','note',D.note)}</div><div class="r"><button class="b" data-a="savecreditor">${D.id?'ذخیره تغییرات':'ثبت بستانکار'}</button><button class="b s" data-a="back">انصراف</button></div>`,
creditorpayf:()=>{const c=db.creditors.find(x=>x.id===D.creditorId),old=db.creditorPayments.find(x=>x.id===D.id),checks=db.pay.filter(p=>p.kind==='cheque'&&p.status!=='returned'&&(receivedChequeRemaining(p.id)>0||p.id===old?.sourcePaymentId));return `<h1>${old?'ویرایش پرداخت به ':'پرداخت به '}${esc(c?.name||'بستانکار')}</h1><div class="c"><div class="metric"><small>مانده بدهی</small><b>${money(creditorBalance(D.creditorId)+(old?.amount||0))}</b></div><div><label>روش پرداخت</label><select data-f="method"><option value="cash" ${D.method==='cash'?'selected':''}>نقدی</option><option value="cheque" ${D.method==='cheque'?'selected':''}>چک</option></select></div>${f('مبلغ پرداخت','amount',D.amount,'inputmode=numeric')}<div><label>تاریخ پرداخت</label>${jpick('dt')}</div>${D.method!=='cheque'&&advArray('accounts').length?advAccountField('accountId','پرداخت از حساب',D.accountId):''}${D.method==='cheque'?`<div><label>نوع چک</label><select data-f="chequeSource"><option value="received" ${D.chequeSource!=='self'?'selected':''}>چک دریافتی که به بستانکار می‌دهیم</option><option value="self" ${D.chequeSource==='self'?'selected':''}>چک صادره از حساب خودمان</option></select></div>${D.chequeSource!=='self'?`<div><label>انتخاب چک دریافتی</label><select data-f="sourcePaymentId"><option value="">انتخاب چک</option>${checks.map(p=>{const remain=receivedChequeRemaining(p.id)+(old?.sourcePaymentId===p.id?(old.amount||0):0);return `<option value="${p.id}" ${D.sourcePaymentId===p.id?'selected':''}>${esc(C(p.cid).n)} · شماره ${esc(p.no||'—')} · مانده ${money(remain)}</option>`}).join('')}</select></div>`:`<div class="chq"><b>مشخصات چک صادره</b>${f('شماره چک','no',D.no)}${f('شناسه صیاد','sayad',D.sayad)}${f('بانک','bank',D.bank)}<div><label>سررسید</label>${jpick('cdt')}</div></div>`}`:''}</div><div class="r"><button class="b" data-a="savecreditorpayment">${old?'ذخیره تغییرات':'ثبت پرداخت'}</button><button class="b s" data-a="back">انصراف</button></div>`},
stockf:()=>`<h1>اصلاح موجودی انبار</h1><div class="c"><b>${esc(D.n||'')}</b>${warehouseEnabled()?advWarehouseField('warehouseId','انبار مربوطه',D.warehouseId):''}${f('مقدار تغییر (+ ورود / - خروج)','qty',D.qty,'inputmode=decimal')}${f('دلیل تغییر','reason',D.reason)}</div><div class="r"><button class="b" data-a="sstock">ثبت تغییر موجودی</button><button class="b s" data-a="back">انصراف</button></div>`,
report:()=>{const now=today(),valid=d=>reportPeriod==='all'||(reportPeriod==='today'?d===now:reportPeriod==='month'?String(d||'').slice(0,7)===now.slice(0,7):String(d||'').slice(0,4)===now.slice(0,4)),invs=db.inv.filter(i=>valid(i.dt)),svcs=db.serviceInv.filter(i=>valid(i.dt)),exps=db.expenses.filter(e=>valid(e.dt)),productSales=sum(invs.map(tot)),serviceSales=sum(svcs.map(serviceTotal)),productProfit=sum(invs.map(profit)),serviceProf=sum(svcs.map(serviceProfit)),expenseTotal=sum(exps.map(e=>e.amt))+totalWastageCost(valid),net=productProfit+serviceProf-expenseTotal,top={};invs.forEach(i=>i.items.forEach(r=>{top[r.n]=(top[r.n]||0)+num(r.q)}));

async function exp(k){
 if(denyDemo())return;
 const paperEl=$('paper');if(!paperEl)return toast('فاکتور برای خروجی پیدا نشد');
 $('ov').scrollTop=0;toast('در حال آماده‌سازی خروجی…');
 try{
  if(typeof window.html2canvas!=='function')throw new Error('کتابخانه ساخت تصویر بارگذاری نشده است');
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const c=await window.html2canvas(paperEl,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,paperEl.scrollWidth),onclone:doc=>{const el=doc.getElementById('paper');if(el){el.style.width=paperEl.scrollWidth+'px';el.style.maxWidth='none';el.style.overflow='visible';}}});
  let bl,nm='factori-invoice';
  if(k==='png'){
   bl=await new Promise((resolve,reject)=>c.toBlob(x=>x?resolve(x):reject(new Error('تبدیل تصویر ناموفق بود')),'image/png'));
   nm+='.png';
  }else{
   const JsPDF=window.jspdf&&window.jspdf.jsPDF;if(!JsPDF)throw new Error('کتابخانه PDF بارگذاری نشده است');
   const w=210,h=c.height*w/c.width,p=new JsPDF({unit:'mm',format:h>297?[w,h]:'a4',orientation:'portrait',compress:true});
   p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h);bl=p.output('blob');nm+='.pdf';
  }
  if(!bl||!bl.size)throw new Error('فایل خروجی خالی ساخته شد');
  const cp=window.Capacitor;
  if(cp&&cp.isNativePlatform&&cp.isNativePlatform()){
   const P=cp.Plugins||{},FS=P.Filesystem,SH=P.Share;
   if(!FS||!SH)throw new Error('دسترسی ذخیره‌سازی یا اشتراک‌گذاری اندروید در دسترس نیست');
   const b64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=()=>reject(new Error('خواندن فایل خروجی ناموفق بود'));fr.readAsDataURL(bl)});
   const saved=await FS.writeFile({path:nm,data:b64,directory:'CACHE'});
   if(!saved||!saved.uri)throw new Error('ذخیره فایل در گوشی ناموفق بود');
   await SH.share({title:nm,text:'خروجی فاکتور فاکتوری',url:saved.uri,dialogTitle:'ذخیره یا ارسال فاکتور'});
   toast('فاکتور آماده شد');return;
  }
  const fl=new File([bl],nm,{type:bl.type});
  if(navigator.canShare&&navigator.canShare({files:[fl]})){try{await navigator.share({files:[fl]});return}catch(e){if(e.name==='AbortError')return}}
  const url=URL.createObjectURL(bl),a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('فایل خروجی آماده شد');
 }catch(e){console.error('[Factori export]',e);toast('خطای خروجی: '+(e&&e.message?e.message:'نامشخص'))}
}

smshelp:()=>{$('ov').innerHTML=`<div class="bar"><button class="b s" data-a="cls">بستن آموزش</button></div><div class="c" style="max-width:720px;margin:10px auto"><h2>آموزش فعال‌سازی پیامک فراز</h2><ol style="padding-right:22px"><li>در پنل فراز وارد بخش «ارسال بر اساس پترن» شوید و برای صدور فاکتور و ثبت دریافت وجه دو پترن جداگانه بسازید.</li><li>متغیرهای هر پترن را دقیقاً با نام‌های زیر تعریف کنید و متن هر پیام را با همان متغیرها بسازید.</li><li>برای نمایش نام برند در انتهای پیام، عبارت <b dir="ltr">%brand%</b> را در انتهای متن پترن قرار دهید و متغیر <b dir="ltr">brand</b> را به فهرست متغیرهای پترن اضافه کنید.</li><li>پس از تأیید پترن‌ها، کد هر دو پترن (UID) را در تنظیمات فاکتوری وارد کنید.</li><li>توکن API، شماره خط و نام برند خودتان را وارد و تنظیمات را ذخیره کنید؛ نام برند برای هر نصب جداگانه ذخیره می‌شود.</li></ol><h2>متغیرهای پترن صدور فاکتور</h2><pre dir="ltr" style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">name, factor, total, paid, remain, brand</pre><pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">مشتری گرامی %name%\nفاکتور شماره %factor% به مبلغ %total% ثبت شد.\nمبلغ پرداختی: %paid%\nمانده حساب: %remain%\n%brand%</pre><h2>متغیرهای پترن ثبت دریافت وجه</h2><pre dir="ltr" style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">name, amount, date, method, remain, brand</pre><pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px">مشتری گرامی %name%\nدریافت وجه به مبلغ %amount% ثبت شد.\nتاریخ: %date%\nروش پرداخت: %method%\nمانده حساب: %remain%\n%brand%</pre><p style="font-size:12px;color:var(--mu)">اگر پترن فعلی شما نام متغیر متفاوتی دارد یا متن انتهایی آن ثابت است، در پنل فراز پترن جدیدی با متغیرهای بالا بسازید و پس از تأیید، UID جدید را در فاکتوری جایگزین کنید. ارسال پترن از API فراز با متغیرهای تعریف‌شده در پترن انجام می‌شود.</p><button class="b s w100" data-a="cls">متوجه شدم</button></div>`;$('ov').className='on'},

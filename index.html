const g2j=(gy,gm,gd)=>{const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let n=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(n/12053);n%=12053;jy+=4*Math.floor(n/1461);n%=1461;if(n>365){jy+=Math.floor((n-1)/365);n=(n-1)%365}return n<186?[jy,1+Math.floor(n/31),1+n%31]:[jy,7+Math.floor((n-186)/30),1+(n-186)%30]},
j2g=(jy,jm,jd)=>{jy+=1595;let n=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(n/146097);n%=146097;if(n>36524){gy+=100*Math.floor(--n/36524);n%=36524;if(n>=365)n++}gy+=4*Math.floor(n/1461);n%=1461;if(n>365){gy+=Math.floor((n-1)/365);n=(n-1)%365}let gd=n+1,gm;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]},

function openJalaliDate(key){if(!D[key])D[key]=today();const [y,m,d]=g2j(...D[key].split('-').map(Number)),cy=g2j(...today().split('-').map(Number))[0],years=[];for(let z=Math.min(cy,y)-5;z<=Math.max(cy,y)+5;z++)years.push(z);const opts=(a,fn,cur)=>a.map(x=>`<option value='${x}' ${x===cur?'selected':''}>${fn(x)}</option>`).join('');$('ov').innerHTML=`<div class='picker-shell'><div class='picker-top'><div class='r' style='margin:0 0 8px'><b style='flex:2'>انتخاب تاریخ شمسی</b><button class='b s' data-a='cls'>بستن</button></div><div class='c'><div class='jd'><select data-j='${key}'>${opts(years,x=>x.toLocaleString('fa-IR',{useGrouping:false}),y)}</select><select data-j='${key}'>${opts(Array.from({length:12},(_,i)=>i+1),x=>MN[x-1],m)}</select><select data-j='${key}'>${opts(Array.from({length:31},(_,i)=>i+1),x=>fa(x),d)}</select></div><small style='display:block;color:var(--mu);margin-top:10px'>سال، ماه و روز را انتخاب کن.</small><button class='b w100' data-a='applydate'>تأیید تاریخ</button></div></div>`;$('ov').className='on';}

function creditorBalance(id){const c=db.creditors.find(x=>x.id===id);return num(c?.amount)-sum(db.creditorPayments.filter(p=>p.creditorId===id).map(p=>p.amount))}
function receivedChequeRemaining(id){const p=db.pay.find(x=>x.id===id);return Math.max(0,num(p?.amt)-sum(db.creditorPayments.filter(x=>x.method==="cheque"&&x.chequeSource==="received"&&x.sourcePaymentId===id).map(x=>x.amount)))}
function dateKey(value){let raw=String(value??'').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[/.]/g,'-');let m=raw.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);if(m){let y=+m[1],mo=+m[2],d=+m[3];if(y>=1300&&y<1700){const g=j2g(y,mo,d);[y,mo,d]=g}if(y>=1900&&mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}const dt=new Date(raw);if(!Number.isNaN(dt.getTime()))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');return ''}
function weekChart(){const byDay=new Map(),todayKey=dateKey(today()),base=new Date(todayKey+'T12:00:00');for(let i=6;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');byDay.set(key,{key,label:d.toLocaleDateString('fa-IR',{weekday:'short'}),amount:0})}for(const inv of db.inv){const k=dateKey(inv.dt);if(byDay.has(k))byDay.get(k).amount+=tot(inv)}for(const inv of db.serviceInv){const k=dateKey(inv.dt);if(byDay.has(k))byDay.get(k).amount+=serviceTotal(inv)}const days=[...byDay.values()],max=Math.max(1,...days.map(x=>x.amount));return days.map(x=>`<div class="week-col" title="${dstr(x.key)} · ${money(x.amount)}"><b style="font-size:10px">${x.amount?fa(x.amount):'۰'}</b><div class="week-bar" style="height:${x.amount?Math.max(7,x.amount/max*70):3}px;opacity:${x.amount?1:.25}"></div><small>${x.label}</small></div>`).join('')+(days.every(x=>!x.amount)?'<small class="em" style="display:block;text-align:center;width:100%">در ۷ روز اخیر فاکتوری ثبت نشده است.</small>':'')}
function creditorRows(){return db.creditors.slice().reverse().map(c=>{const b=creditorBalance(c.id);return `<div class="creditor-card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.name)}</b><b style="color:${b>0?"var(--dg)":"var(--ok)"}">${money(b)}</b></div><small>${dstr(c.dt)} · ${esc(c.note||"بستانکار")}</small><div class="r"><button class="b s" data-a="newcreditorpayment" data-id="${c.id}">ثبت پرداخت</button><button class="b s" data-a="creditorhistory" data-id="${c.id}">گردش حساب</button></div></div>`}).join("")||"<p class=\"em\">هنوز بستانکاری ثبت نشده است.</p>"}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<style>

body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6}

.g,.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gs{margin-bottom:12px}

.au{position:fixed;inset:0;z-index:40;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) 24px max(28px,env(safe-area-inset-bottom,0px));text-align:center;color:#fff;background:radial-gradient(circle at 15% 10%,#14b8a6 0,transparent 45%),radial-gradient(circle at 90% 95%,#6366f1 0,transparent 45%),linear-gradient(160deg,#064e3b,#0f172a)}

.au .logo{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 10px 40px rgba(0,0,0,.35)}

.au .ft{display:flex;gap:12px;align-items:center;text-align:right;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;margin-bottom:10px}.au .ft i{font-style:normal;font-size:24px}.au .ft small{display:block;opacity:.75}
.au input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);margin-bottom:10px;text-align:center;font-size:18px}.au input::placeholder{color:rgba(255,255,255,.6)}
.au .b{background:#fff;color:#064e3b;border-color:#fff;margin-top:12px;padding:13px}.au .b.s{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.au .v{opacity:.5;font-size:11px;margin-top:20px}.au .logo svg{width:62px;height:68px}
.fi{position:relative;overflow:hidden}.fi input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
#ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:50}#ts.on{opacity:1}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);overflow:auto;z-index:30;padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px)}#ov.on{display:block}
#ov .bar{display:flex;gap:8px;max-width:720px;margin:8px auto}#ov .bar .b{flex:1}
.pp{background:#fff;color:#111;max-width:720px;margin:0 auto 14px;padding:16px;font-size:12.5px;border:2px solid #111}
.ph{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:10px}.ph img{max-height:60px;max-width:100px}.ph h3{margin:0;text-align:center;font-size:19px}.ph .rt{text-align:left;line-height:1.9}
.pb2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.pb2>div{border:1px solid #111;padding:8px;line-height:1.8}
.pp table{width:100%;border-collapse:collapse}.pp th{background:#1e293b;color:#fff;padding:6px;border:1px solid #111}.pp td{padding:6px;border:1px solid #111;text-align:center}.pp td.l{text-align:right}
.tt2{width:60%;margin:10px auto 0 0;border:1px solid #111}.tt2 div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #ccc}.tt2 .gt{font-weight:700;background:#e2e8f0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;text-align:center}.sg>div{border:1px solid #111;min-height:90px;padding:6px}.sg img{max-height:70px;max-width:130px;display:block;margin:4px auto 0}
:root{--sh:0 4px 18px rgba(15,23,42,.07);--gr:linear-gradient(135deg,#0f766e,#4338ca)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 4px 18px rgba(0,0,0,.35);--gr:linear-gradient(135deg,#0d9488,#4f46e5)}}
main{padding:14px 14px 110px}
h1{font-size:20px;display:flex;align-items:center;gap:8px;margin:4px 0 14px}h1::before{content:"";width:5px;height:22px;border-radius:3px;background:var(--gr)}.au h1::before{display:none}
.c{border:0;border-radius:18px;box-shadow:var(--sh);padding:16px}.c h2{font-size:13px;color:var(--tx);font-weight:700}
input,select,textarea{border-radius:12px;padding:11px 12px;border:1.5px solid var(--bd)}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
.b{border-radius:12px;background:var(--gr);border:0;color:#fff;box-shadow:0 4px 14px rgba(67,56,202,.25)}.b.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr);box-shadow:none}.b.dg{background:transparent;border:1.5px solid var(--dg);box-shadow:none}.au .b.s{border:1.5px solid rgba(255,255,255,.5)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:0;border-radius:22px;box-shadow:0 8px 30px rgba(15,23,42,.22);max-width:700px;margin:0 auto;gap:2px}nav button{border-radius:16px;padding:6px 0;transition:.2s}nav .on{background:color-mix(in srgb,var(--pr) 15%,transparent)}
#ts{bottom:104px}
.hero{background:var(--gr);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(67,56,202,.3);position:relative;overflow:hidden}.hero::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1);left:-40px;top:-60px}
.hero small{opacity:.85}.hero .big{font-size:26px;font-weight:800;margin:2px 0}.hero .mini{display:flex;gap:10px;margin-top:12px}.hero .mini div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}.hero .mini b{display:block}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.qa button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:12px 4px;font:inherit;font-size:12px;color:var(--tx)}.qa i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
.st{border:0;box-shadow:var(--sh);border-radius:16px;display:flex;gap:10px;align-items:center}.st i{font-style:normal;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pr) 14%,transparent);font-size:18px;flex:none}
.av{width:42px;height:42px;border-radius:14px;background:var(--gr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.li{padding:12px 0}
.jd{display:grid;grid-template-columns:1.1fr 1.5fr 1fr;gap:6px}.jd select{padding:10px 6px}
.sw{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw .on{box-shadow:0 0 0 3px var(--pr)}
.pp{border-color:var(--ac)}.pp .ph{border-bottom-color:var(--ac)}.pp .pb2>div,.pp .tt2,.pp .sg>div{border-color:var(--ac)}.pp th{background:var(--ac)}.pp td,.pp th{border-color:var(--ac)}.pp .tt2 .gt{background:var(--al)}
.pp.t2{border:0;border-radius:16px;overflow:hidden}.pp.t2 .ph{background:var(--ac);color:#fff;margin:-16px -16px 12px;padding:16px;border:0}.pp.t2 .pb2>div{border:0;border-radius:10px;background:var(--as)}.pp.t2 td,.pp.t2 th{border:0}.pp.t2 tr:nth-child(even) td{background:#f1f5f9}.pp.t2 .tt2{border:0;border-radius:10px;overflow:hidden;background:#f1f5f9}.pp.t2 .sg>div{border:1px dashed var(--ac);border-radius:10px}
.pp.t3{border:0;border-top:6px solid var(--ac);box-shadow:0 0 0 1px #e2e8f0}.pp.t3 .ph{border-bottom:1px solid #cbd5e1}.pp.t3 h3{color:var(--ac)}.pp.t3 .pb2>div{border:0;border-bottom:1px solid #e2e8f0}.pp.t3 th{background:none;color:var(--ac);border:0;border-bottom:2px solid var(--ac)}.pp.t3 td{border:0;border-bottom:1px solid #e2e8f0}.pp.t3 .tt2{border:0}.pp.t3 .tt2 .gt{background:none;color:var(--ac);font-size:15px}.pp.t3 .sg>div{border:0;border-top:1px solid #94a3b8}
</style>

<body>
<div id="app"></div><div id="ov"></div><div id="ts"></div>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),fa=n=>Math.round(n).toLocaleString('fa-IR'),
num=s=>{s=String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'').replace('٫','.');return parseFloat(s)||0},
fq=n=>num(n).toLocaleString('fa-IR'),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=a=>a.reduce((x,y)=>x+num(y),0);
const K='db:v2';
let db={cust:[],prod:[],inv:[],pay:[],seq:1000,cu:'ریال',sn:'',sp:'',ad:''};
try{Object.assign(db,JSON.parse(localStorage.getItem(K))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('حافظه پر است')}},
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
money=n=>fa(n)+' '+db.cu,
dstr=d=>d?new Date(d).toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}):'',
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
C=id=>db.cust.find(c=>c.id===id)||{n:'—'},
subt=i=>sum(i.items.map(r=>num(r.q)*num(r.p))),
disc=i=>Math.min(num(i.ds),subt(i)),
taxv=i=>(subt(i)-disc(i))*num(i.tx)/100,
tot=i=>subt(i)-disc(i)+taxv(i),
profit=i=>sum(i.items.map(r=>(num(r.p)-num(r.b))*num(r.q)))-disc(i),
bal=id=>sum(db.inv.filter(i=>i.cid===id).map(tot))-sum(db.pay.filter(p=>p.cid===id).map(p=>p.amt)),
stk=(it,sg)=>it.forEach(r=>{const p=db.prod.find(x=>x.id===r.pid);if(p)p.qty=num(p.qty)+sg*num(r.q)}),
H=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('inv'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('x'+s)))}};
let lock=true,lk='sp',v={t:'home'},D={},IV=null,tt;
function toast(m){const t=$('ts');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)}
const go=(t,x)=>{v={t,...x};render();scrollTo(0,0)};
const f=(l,k,val,ex='')=>`<div><label>${l}</label><input data-f="${k}" value="${esc(val)}" ${ex}></div>`;
const sel=(k,list,cur,ph)=>`<select data-f="${k}"><option value="">${ph}</option>${list.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`;

/* ---- jalali ---- */
const g2j=(gy,gm,gd)=>{const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let n=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(n/12053);n%=12053;jy+=4*Math.floor(n/1461);n%=1461;if(n>365){jy+=Math.floor((n-1)/365);n=(n-1)%365}return n<186?[jy,1+Math.floor(n/31),1+n%31]:[jy,7+Math.floor((n-186)/30),1+(n-186)%30]},
j2g=(jy,jm,jd)=>{jy+=1595;let n=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(n/146097);n%=146097;if(n>36524){gy+=100*Math.floor(--n/36524);n%=36524;if(n>=365)n++}gy+=4*Math.floor(n/1461);n%=1461;if(n>365){gy+=Math.floor((n-1)/365);n=(n-1)%365}let gd=n+1,gm;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]},
MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jpick(k){if(!D[k])D[k]=today();const[y,m,d]=g2j(...D[k].split('-').map(Number)),cy=g2j(...today().split('-').map(Number))[0],ys=[];for(let i=Math.min(cy,y)-4;i<=Math.max(cy,y)+4;i++)ys.push(i);
 const o=(a,l,c)=>a.map(x=>`<option value="${x}" ${x==c?'selected':''}>${l(x)}</option>`).join(''),r=(n)=>Array.from({length:n},(_,i)=>i+1);
 return `<div class="jd"><select data-j="${k}">${o(ys,x=>x.toLocaleString('fa-IR',{useGrouping:false}),y)}</select><select data-j="${k}">${o(r(12),x=>MN[x-1],m)}</select><select data-j="${k}">${o(r(31),x=>fa(x),d)}</select></div>`}
const COLS=['#1e293b','#0f766e','#4338ca','#b91c1c','#c2410c','#7c3aed'],mix=(h,a)=>'#'+[1,3,5].map(i=>Math.round(255-(255-parseInt(h.substr(i,2),16))*a).toString(16).padStart(2,'0')).join('');
/* ---- lists ---- */
const invRows=l=>l.length?l.map(i=>`<div class="li"><div><b>#${fa(i.no)}</b> ${esc(C(i.cid).n)}<br><small>${dstr(i.dt)} · ${money(tot(i))}</small></div><div class="ac"><button data-a="vinv" data-id="${i.id}">مشاهده</button><button data-a="einv" data-id="${i.id}">ویرایش</button><button class="dg" data-a="dinv" data-id="${i.id}">حذف</button></div></div>`).join(''):'<p class="em">فاکتوری نیست.</p>',
payRows=l=>l.length?l.slice().reverse().map(p=>`<div class="li"><div><b>${money(p.amt)}</b> ${esc(C(p.cid).n)}<br><small>${dstr(p.dt)} · ${p.kind=='cheque'?`چک ${esc(p.no)} · صیاد ${esc(p.sayad)} · سررسید ${dstr(p.cdt)}`:'نقدی'}</small></div><div class="ac"><button class="dg" data-a="dpay" data-id="${p.id}">حذف</button></div></div>`).join(''):'<p class="em">پرداختی ثبت نشده.</p>';

/* ---- views ---- */
const VIEWS={
home:()=>{const s=sum(db.inv.map(tot)),r=sum(db.pay.map(p=>p.amt)),pf=sum(db.inv.map(profit));
 return `<h1>🧾 ${esc(db.sn||'فاکتورساز')}</h1><div class="gs">${[['تعداد فاکتور',fa(db.inv.length)],['کل فروش',money(s)],['کل دریافتی',money(r)],['مانده حساب',money(s-r)],['سود / زیان کالاهای فروخته‌شده',money(pf),pf<0?'neg':'pos']].map(([a,b,c])=>`<div class="st ${c||''}"><small>${a}</small><b>${b}</b></div>`).join('')}</div><button class="b w100" style="margin:0 0 12px" data-a="newinv">+ فاکتور جدید</button><div class="c"><h2>آخرین فاکتورها</h2>${invRows(db.inv.slice(-5).reverse())}</div>`},
inv:()=>`<h1>فاکتورها</h1><button class="b w100" style="margin:0 0 12px" data-a="newinv">+ فاکتور جدید</button><div class="c">${invRows(db.inv.slice().reverse())}</div>`,
invf:()=>`<h1>${D.id?'ویرایش فاکتور':'فاکتور جدید'}</h1><div class="c"><div class="g"><div><label>مشتری</label>${sel('cid',db.cust,D.cid,'انتخاب مشتری…')}<button class="lnk" data-a="newc">+ مشتری جدید</button></div>${f('شماره','no',D.no,'inputmode=numeric')}</div><div><label>تاریخ</label>${jpick('dt')}</div></div>
<div class="c"><h2>اقلام (از لیست کالا)</h2>${D.items.map((r,i)=>`<div class="row"><select data-r="${i}" data-k="pid"><option value="">کالا…</option>${db.prod.map(p=>`<option value="${p.id}" ${p.id===r.pid?'selected':''}>${esc(p.n)} (${fq(p.qty)})</option>`).join('')}</select><input data-r="${i}" data-k="q" value="${esc(r.q)}" inputmode="decimal"><input data-r="${i}" data-k="p" value="${esc(r.p)}" inputmode="numeric" placeholder="قیمت"><button class="x" data-a="rrow" data-id="${i}">×</button></div>`).join('')}${db.prod.length?'':'<p class="em">ابتدا از بخش «کالا» محصول اضافه کن.</p>'}<button class="b s w100" style="margin:0" data-a="arow">+ ردیف</button></div>

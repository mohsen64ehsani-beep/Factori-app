<script>
const $=id=>document.getElementById(id),fa=n=>Math.round(n).toLocaleString('fa-IR'),
num=s=>{s=String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'').replace('٫','.');return parseFloat(s)||0},
fq=n=>num(n).toLocaleString('fa-IR'),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=a=>a.reduce((x,y)=>x+num(y),0);
const K='db:v2';
let db={cust:[],prod:[],inv:[],pay:[],seq:1000,cu:'ریال',sn:'',sp:'',ad:''};
try{Object.assign(db,JSON.parse(localStorage.getItem(K))||{})}catch(e){}
const save=()=>{if(demoMode)return;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('حافظه پر است')}},
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
money=n=>fa(n)+' '+db.cu,
dstr=d=>d?new Date(d).toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}):'',
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
C=id=>db.cust.find(c=>c.id===id)||{n:'—'},
subt=i=>sum(i.items.map(r=>num(r.q)*num(r.p))),
disc=i=>Math.min(num(i.ds),subt(i)),
taxv=i=>(subt(i)-disc(i))*num(i.tx)/100,
tot=i=>subt(i)-disc(i)+taxv(i),
profit=i=>sum(i.items.map(r=>(num(r.p)-num(r.b))*num(r.q)))-disc(i),
bal=id=>sum(db.inv.filter(i=>i.cid===id).map(tot))-sum(db.pay.filter(p=>p.cid===id).map(p=>p.amt)),
stk=(it,sg)=>it.forEach(r=>{const p=db.prod.find(x=>x.id===r.pid);if(p)p.qty=num(p.qty)+sg*num(r.q)}),
H=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('inv'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('x'+s)))}};
let lock=true,lk='sp',v={t:'home'},D={},IV=null,tt;

 cust:[

 ],

  {id:'demo-i1',no:1001,dt:today(),cid:'demo-c1',items:[{pid:'demo-p1',n:'کالای نمونه A',q:2,p:180000,b:120000},{pid:'demo-p3',n:'خدمات نصب',q:1,p:150000,b:0}],ds:0,tx:0},
  {id:'demo-i2',no:1002,dt:today(),cid:'demo-c2',items:[{pid:'demo-p2',n:'کالای نمونه B',q:1,p:320000,b:250000}],ds:20000,tx:0},
  {id:'demo-i3',no:1003,dt:today(),cid:'demo-c3',items:[{pid:'demo-p1',n:'کالای نمونه A',q:3,p:180000,b:120000}],ds:10000,tx:0}
 ],

 seq:1003,cu:'تومان',sn:'فروشگاه نمونه',sp:'09120000000',ad:'تهران، خیابان نمونه'
});

const buyHtml=()=>`<div class="buy-panel"><b>برای استفاده کامل، لایسنس فاکتوری را تهیه کنید</b><button class="b s w100" data-a="licenseui">🔑 وارد کردن کد لایسنس</button><a class="b w100" href="https://wa.me/989397050966" target="_blank" rel="noopener">🛒 خرید لایسنس از واتساپ</a><a class="lnk" href="tel:+989397050966">تماس: 09397050966</a></div>`;
function licenseUi(){ $('ov').innerHTML=`<div class="bar"><button class="b s" data-a="cls">بستن</button></div><div class="c" style="max-width:520px;margin:18px auto"><h2>فعال‌سازی لایسنس فاکتوری</h2><label for="licenseCode">کد لایسنس</label><input id="licenseCode" dir="ltr" autocomplete="off" placeholder="کد لایسنس را وارد کن"><button class="b w100" data-a="licensecheck">بررسی و فعال‌سازی</button><p class="em" style="font-size:12px;margin-top:12px">اتصال سرویس اعتبارسنجی لایسنس هنوز تکمیل نشده است؛ در حال حاضر این بخش فقط محل ورود کد را نمایش می‌دهد و هیچ کدی را فعال نمی‌کند.</p><a class="b s w100" href="https://wa.me/989397050966" target="_blank" rel="noopener">دریافت لایسنس از پشتیبانی</a></div>`;$('ov').className='on'}

const go=(t,x)=>{v={t,...x};render();scrollTo(0,0)};
const f=(l,k,val,ex='')=>`<div><label>${l}</label><input data-f="${k}" value="${esc(val)}" ${ex}></div>`;
const sel=(k,list,cur,ph)=>`<select data-f="${k}"><option value="">${ph}</option>${list.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.n)}</option>`).join('')}</select>`;

/* ---- jalali ---- */
const g2j=(gy,gm,gd)=>{const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let n=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(n/12053);n%=12053;jy+=4*Math.floor(n/1461);n%=1461;if(n>365){jy+=Math.floor((n-1)/365);n=(n-1)%365}return n<186?[jy,1+Math.floor(n/31),1+n%31]:[jy,7+Math.floor((n-186)/30),1+(n-186)%30]},
j2g=(jy,jm,jd)=>{jy+=1595;let n=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(n/146097);n%=146097;if(n>36524){gy+=100*Math.floor(--n/36524);n%=36524;if(n>=365)n++}gy+=4*Math.floor(n/1461);n%=1461;if(n>365){gy+=Math.floor((n-1)/365);n=(n-1)%365}let gd=n+1,gm;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]},
MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jpick(k){if(!D[k])D[k]=today();const[y,m,d]=g2j(...D[k].split('-').map(Number)),cy=g2j(...today().split('-').map(Number))[0],ys=[];for(let i=Math.min(cy,y)-4;i<=Math.max(cy,y)+4;i++)ys.push(i);
 const o=(a,l,c)=>a.map(x=>`<option value="${x}" ${x==c?'selected':''}>${l(x)}</option>`).join(''),r=(n)=>Array.from({length:n},(_,i)=>i+1);
 return `<div class="jd"><select data-j="${k}">${o(ys,x=>x.toLocaleString('fa-IR',{useGrouping:false}),y)}</select><select data-j="${k}">${o(r(12),x=>MN[x-1],m)}</select><select data-j="${k}">${o(r(31),x=>fa(x),d)}</select></div>`}
/* ---- lists ---- */
const invRows=l=>l.length?l.map(i=>`<div class="li"><div><b>#${fa(i.no)}</b> ${esc(C(i.cid).n)}<br><small>${dstr(i.dt)} · ${money(tot(i))}</small></div><div class="ac"><button data-a="vinv" data-id="${i.id}">مشاهده</button><button data-a="einv" data-id="${i.id}">ویرایش</button><button class="dg" data-a="dinv" data-id="${i.id}">حذف</button></div></div>`).join(''):'<p class="em">فاکتوری نیست.</p>',
payRows=l=>l.length?l.slice().reverse().map(p=>`<div class="li"><div><b>${money(p.amt)}</b> ${esc(C(p.cid).n)}<br><small>${dstr(p.dt)} · ${p.kind=='cheque'?`چک ${esc(p.no)} · صیاد ${esc(p.sayad)} · سررسید ${dstr(p.cdt)}`:'نقدی'}</small></div><div class="ac"><button class="dg" data-a="dpay" data-id="${p.id}">حذف</button></div></div>`).join(''):'<p class="em">پرداختی ثبت نشده.</p>';

/* ---- views ---- */

async function exp(k){if(denyDemo())return;$('ov').scrollTop=0;toast('در حال ساخت…');
 try{const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff'});let bl,nm='invoice';
  if(k=='png'){bl=await new Promise(r=>c.toBlob(r,'image/png'));nm+='.png'}
  else{const w=210,h=c.height*w/c.width,p=new jspdf.jsPDF({unit:'mm',format:h>297?[w,h]:'a4'});p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h);bl=p.output('blob');nm+='.pdf'}
  const cp=window.Capacitor;if(cp&&cp.isNativePlatform&&cp.isNativePlatform()){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(bl)});const P=cp.Plugins,w=await P.Filesystem.writeFile({path:nm,data:b64,directory:'CACHE'});await P.Share.share({title:nm,url:w.uri});return}
  const fl=new File([bl],nm,{type:bl.type});
  try{if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return}}catch(e){if(e.name=='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=nm;document.body.appendChild(a);a.click();a.remove();toast('اگر ذخیره نشد، صفحه را در Chrome باز کن')
 }catch(e){toast('ساخت خروجی ناموفق بود (اینترنت؟)')}}

async function bioOn(){try{const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'فاکتوری'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:'کاربر'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});db.bio=btoa(String.fromCharCode(...new Uint8Array(cr.rawId)));save();return true}catch(e){return false}}
async function bioLogin(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:Uint8Array.from(atob(db.bio),c=>c.charCodeAt(0))}],userVerification:'required',timeout:60000}});return true}catch(e){return false}}
